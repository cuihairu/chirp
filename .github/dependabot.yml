# P0: stop security-update failures in /docs.
# vitepress@1.x pins vite@^5 (locked 5.4.21) and esbuild@^0.21 (locked 0.21.5);
# security fixes require vite>=6.4.3 and esbuild>=0.28.1, unreachable within
# current semver ranges, so Dependabot security updates exit with
# security_update_not_possible. Ignore until vitepress stable ships vite>=6.
version: 2
updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    ignore:
      - dependency-name: vite
      - dependency-name: esbuild

  # Root npm workspace (apps/shared/protocol, apps/web_companion, sdks/ts).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      workspace-npm:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      desktop-npm:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/admin_dashboard
    schedule:
      interval: weekly
    groups:
      admin-npm:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      desktop-cargo:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /deployments/docker
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types:
          - minor
          - patch

  # Deliberately no gradle entry for /apps/android: the Android stack is
  # hand-pinned (AGP 9 built-in Kotlin, no KGP plugin, kotlin-test locked to
  # 2.2.20); automated bumps would fight those gates. Revisit when the pins
  # move.
