name: iOS App

# The companion app's Xcode project is generated by xcodegen from
# apps/ios/project.yml (the .xcodeproj is not committed). This leg proves:
# 1. the generated project builds for the iOS Simulator on the macOS
#    toolchain, 2. the package tests (protocol core + app core) run on a
#    real macOS toolchain — previously they were local-Linux-only. proto/
#    is in the trigger surface because the committed Swift gencode in
#    Sources/ChirpProtos is regenerated from it.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/ios/**'
      - 'proto/**'
      - '.github/workflows/ios-app.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/ios/**'
      - 'proto/**'
      - '.github/workflows/ios-app.yml'

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate --spec apps/ios/project.yml

      - name: Build the app (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/ChirpCompanion.xcodeproj \
            -scheme ChirpCompanion \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Run the package tests (protocol core + app core)
        run: swift test --package-path apps/ios
