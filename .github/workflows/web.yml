name: Web

# The web companion lives in its own workflow: its node toolchain has nothing
# to do with the C++ jobs, and paths filtering keeps C++ pushes from spinning
# node runners (and vice versa — CI/CMake/Mobile do not watch web sources).
# The pnpm-lock.yaml sits at the repo root (pnpm workspace), so installs
# run there; scripts run inside apps/web_companion. @chirp/protocol (sdks/ts)
# is a workspace of the same lockfile and gets its own test step below.
# apps/shared/protocol (@chirp/app-protocol) is the companion apps' own
# protocol layer — sdks/ is the game-facing surface, apps do not depend on it.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/web_companion/**'
      - 'apps/shared/protocol/**'
      - 'sdks/ts/**'
      - 'proto/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/web_companion/**'
      - 'apps/shared/protocol/**'
      - 'sdks/ts/**'
      - 'proto/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web_companion
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: pnpm/action-setup@v6.1.0
      with:
        # Same major as local and docs.yml; the lockfile is v9 format.
        version: 12

    - uses: actions/setup-node@v7.1.0
      with:
        # Pinned to the version development actually runs (vite 8 needs
        # >=22.12; 24 is the current dev node, CI verifies what devs use).
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      working-directory: .
      run: pnpm install --frozen-lockfile

    - name: Test @chirp/protocol
      working-directory: sdks/ts
      run: |
        pnpm run typecheck
        pnpm test -- --coverage

    - name: Test @chirp/app-protocol
      working-directory: apps/shared/protocol
      run: |
        pnpm run typecheck
        pnpm test -- --coverage

    - name: Typecheck
      run: pnpm run typecheck

    - name: Lint
      run: pnpm run lint

    - name: Test with coverage
      run: pnpm test -- --coverage

    - name: Build
      run: pnpm run build

  proto-sync:
    # The generated TS is committed; regenerate and fail on drift so the
    # checked-in files never silently diverge from the .proto sources.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install protobuf compiler
      run: |
        timeout 900 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update || true
        timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y protobuf-compiler

    - uses: pnpm/action-setup@v6.1.0
      with:
        version: 12

    - uses: actions/setup-node@v7.1.0
      with:
        # Pinned to the version development actually runs (vite 8 needs
        # >=22.12; 24 is the current dev node, CI verifies what devs use).
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # Root install: ts-proto is a devDependency of apps/web_companion, so its
    # protoc plugin lands in apps/web_companion/node_modules/.bin — the path
    # gen_proto.sh prefers (its fallback to the repo-root bin is the legacy
    # npm-workspaces hoisting layout).
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Regenerate TypeScript protos
      run: bash gen_proto.sh

    # -I ignores hunks that only touch the protoc version banner: the CI
    # compiler's version differs from whatever generated the committed files,
    # and that banner is not a real drift signal.
    - name: Check for drift
      run: |
        git diff -I'^//   protoc ' --exit-code -- proto/ts \
          || (echo "::error::proto/ts is stale — run gen_proto.sh and commit" && exit 1)
