name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    runs-on: ubuntu-22.04
    env:
      CMAKE_ARGS: -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build protobuf-compiler pkg-config autoconf automake libtool libtool-bin autoconf-archive

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh

    - name: Install vcpkg dependencies
      run: ./vcpkg/vcpkg install --triplet x64-linux

    - name: Generate proto files
      run: ./gen_proto.sh

    - name: Run tests with coverage
      run: scripts/run_coverage.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.lcov
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  smoke:
    runs-on: ubuntu-22.04
    # The vcpkg toolchain links libmariadb (MariaDB Connector/C), so the smoke
    # job builds the ENHANCED
    # chirp_app_auth (main_enhanced.cc), which exits at startup when it cannot
    # reach MySQL (UserStore::Initialize is fatal; Redis is fail-open). The
    # credentials match the service's defaults (chirp / chirp_password /
    # chirp database), so the smoke's plain `chirp_app_auth --port` launch
    # connects without extra flags. Tables are not required for the smoke:
    # UserStore::Initialize only verifies the connection.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chirp
          MYSQL_USER: chirp
          MYSQL_PASSWORD: chirp_password
          MYSQL_ROOT_PASSWORD: chirp_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install system dependencies
      # redis-server: --smoke-edge hard-depends on it (login rate limiting
      # counts in Redis); --smoke-chat/--smoke-sdk then also run Redis mode,
      # matching the local smoke environment.
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build protobuf-compiler pkg-config autoconf automake libtool libtool-bin autoconf-archive redis-server redis-tools

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh

    - name: Install vcpkg dependencies
      run: ./vcpkg/vcpkg install --triplet x64-linux

    - name: Generate proto files
      run: ./gen_proto.sh

    - name: Configure CMake
      run: |
        cmake --preset ci \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCHIRP_WARNINGS_AS_ERRORS=ON \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -G Ninja

    - name: Build
      run: cmake --build --preset ci -j$(nproc)

    # One step per smoke: when a smoke wedges, the job's step list names the
    # culprit directly (in-progress logs are not fetchable via the API), and
    # the `timeout` wrapper turns a wedge into a failed step instead of a
    # job that never finishes.
    - name: "Smoke: auth + gateway"
      run: timeout 600 bash test_services.sh --smoke

    - name: "Smoke: pure game plane (no app_auth)"
      run: timeout 600 bash test_services.sh --smoke-game

    - name: "Smoke: chat offline/history"
      run: timeout 600 bash test_services.sh --smoke-chat

    - name: "Smoke: SDK E2E"
      run: timeout 600 bash test_services.sh --smoke-sdk

    - name: "Smoke: NPC server-plane loop"
      run: timeout 600 bash test_services.sh --smoke-npc

    - name: "Smoke: gateway chat entry (trusted bridge)"
      run: timeout 600 bash test_services.sh --smoke-edge

    - name: "Smoke: unified JWT login (auth <-> chat secret alignment)"
      run: timeout 600 bash test_services.sh --smoke-jwt

    - name: "Smoke: cross-instance kick (docker redis)"
      run: timeout 900 bash test_services.sh --smoke-redis

  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build protobuf-compiler pkg-config autoconf automake libtool libtool-bin autoconf-archive

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh

    - name: Install vcpkg dependencies
      run: ./vcpkg/vcpkg install --triplet x64-linux

    - name: Generate proto files
      run: ./gen_proto.sh

    - name: Configure CMake
      run: |
        cmake --preset ci \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCHIRP_WARNINGS_AS_ERRORS=ON \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -G Ninja

    - name: Build
      run: cmake --build --preset ci --config ${{ matrix.build_type }} -j$(nproc)

    - name: Verify tests are discovered
      shell: bash
      run: |
        ctest --test-dir build -N -C ${{ matrix.build_type }} | tee ctest-list.txt
        grep -Eq "Total Tests: [1-9][0-9]*" ctest-list.txt

    - name: Run tests
      run: |
        ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
