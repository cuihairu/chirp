name: Mobile Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Android build
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Set up Java
      uses: actions/setup-java@v5.6.0
      with:
        distribution: 'zulu'
        java-version: '17'

    # android-actions/setup-android@v4 broke against the 2026-09 runner image:
    # it rejects the preinstalled sdkmanager as the "wrong version" and then
    # tries to install the long-deprecated `tools` package, which Google
    # removed. The runner image already ships the SDK under ANDROID_HOME, so
    # accepting licenses is all a Flutter build needs -- Gradle fetches any
    # missing platform/build-tools components itself.
    - name: Accept Android SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Flutter version
      run: flutter --version

    - name: Flutter doctor
      run: flutter doctor -v

    - name: Install Flutter dependencies
      working-directory: apps/mobile_companion
      run: |
        flutter clean
        flutter pub get

    - name: Generate proto files
      run: ./gen_proto.sh

    - name: Build Android APK (Debug)
      working-directory: apps/mobile_companion
      run: flutter build apk --debug --build-number=${{ github.run_number }}

    - name: Build Android APK (Release)
      working-directory: apps/mobile_companion
      run: flutter build apk --release --build-number=${{ github.run_number }}

    - name: Build Android App Bundle (Release)
      working-directory: apps/mobile_companion
      run: flutter build appbundle --release --build-number=${{ github.run_number }}

    - name: Upload Android APK
      uses: actions/upload-artifact@v7
      with:
        name: android-apk
        path: apps/mobile_companion/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Upload Android App Bundle
      uses: actions/upload-artifact@v7
      with:
        name: android-aab
        path: apps/mobile_companion/build/app/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Run Flutter tests
      working-directory: apps/mobile_companion
      run: flutter test

  # Code analysis
  analyze:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Install Flutter dependencies
      working-directory: apps/mobile_companion
      run: |
        flutter clean
        flutter pub get

    - name: Analyze Flutter code
      working-directory: apps/mobile_companion
      run: flutter analyze --fatal-infos

    - name: Check formatting
      working-directory: apps/mobile_companion
      run: dart format --set-exit-if-changed .

    - name: Verify build
      working-directory: apps/mobile_companion
      run: flutter pub run build_runner build --delete-conflicting-outputs
