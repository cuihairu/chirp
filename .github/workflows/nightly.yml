name: Nightly Build

# 每日构建:打包当前真产物(C++ core 库 + Go SDK + TS SDK + 桌面 App),
# 三路分发:
#   1. nightly Release(交付面)——固定 tag `nightly` 的滚动 Release:资产
#      清旧传新(全平台包 + SHA256SUMS),notes 带最近提交摘要与下载指引
#      (参照 memex/luna 的 nightly 形态;只 main 分支发);
#   2. Actions artifact——固定名 daily-build,上传时覆盖旧一份
#      (upload-artifact overwrite;run 页临时下载,14 天过期);
#   3. nightly-dist 分支镜像——固定文件名 + manifest.json,每次 force 推
#      单个孤儿提交覆盖。这是 install.sh / install.ps1 一键安装的下载源:
#      raw.githubusercontent 匿名可直链,不依赖 Actions API(匿名限流
#      60 次/小时/IP,共享出口 IP 下不可靠),也不要求登录。
#
# 矩阵(四腿):linux x86_64/aarch64(.deb)+ darwin arm64(macos-latest,
# Tauri .app/.dmg)+ windows x64(windows-latest,Tauri NSIS -setup.exe)。
# darwin/windows 的 C++ 编译面已由 cmake-multi-platform 四腿证明,本矩阵
# 在其上加桌面打包与产物分发;darwin-x64 与 windows-arm64 仍无腿,安装
# 脚本按 manifest 如实报缺口。
#
# schedule 用非整点分钟(19:23 UTC,避开整点风潮)。48h staleness gate
# 只门控 schedule 事件:HEAD 与最近一次成功 nightly 相同且其完成时间
# 距今不足 48h 时跳过(仓库静止时不浪费 runner;GitHub cron 迟发/重发
# 也不会产生重复构建);workflow_dispatch 永远构建,不受该门控约束。

on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip scheduled build when HEAD already built within 48h
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Defensive by design: any parse/lookup failure means "don't skip"
          # (a broken gate must never silently suppress builds), and the step
          # always exits 0 so a flaky API never reddens the run.
          skip=false
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml \
            --branch "$GITHUB_REF_NAME" --status success --limit 1 \
            --json headSha,completedAt 2>/dev/null || echo '[]')"
          sha="$(printf '%s' "$last" | jq -r '.[0].headSha // empty')"
          done_at="$(printf '%s' "$last" | jq -r '.[0].completedAt // empty')"
          if [ -n "$sha" ] && [ "$sha" = "$GITHUB_SHA" ] && [ -n "$done_at" ]; then
            age=$(( $(date +%s) - $(date -d "$done_at" +%s) ))
            echo "last successful nightly built $sha ${age}s ago"
            if [ "$age" -lt 172800 ]; then
              skip=true
              echo "same HEAD built within 48h — scheduled build skipped"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    # dispatch: gate is skipped, outputs are empty -> build runs;
    # schedule: build unless the gate decided to skip.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux-x64
            vcpkg_triplet: x64-linux
            rust_target: x86_64-unknown-linux-gnu
            host_sdks: true   # Go/TS 与 @chirp/protocol 打包只在 x64 腿做一次
          - os: ubuntu-24.04-arm
            arch: linux-arm64
            vcpkg_triplet: arm64-linux
            rust_target: aarch64-unknown-linux-gnu
            host_sdks: false
          - os: macos-latest
            arch: darwin-arm64
            vcpkg_triplet: arm64-osx
            rust_target: aarch64-apple-darwin
            host_sdks: false
          - os: windows-latest
            arch: windows-x64
            vcpkg_triplet: x64-windows
            rust_target: x86_64-pc-windows-msvc
            host_sdks: false
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        timeout 900 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update || true
        timeout 900 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ninja-build pkg-config autoconf automake libtool libtool-bin autoconf-archive rsync

    # macOS 镜像自带 cmake/ninja/pkg-config;C++ 依赖全走 vcpkg,brew 只补
    # autotools 族(overlay 的 libsodium 1.0.22 端口走 autotools,还点名
    # autoconf-archive——比 cmake-multi-platform 的 brew 清单多一味)。
    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install autoconf autoconf-archive automake libtool

    # Windows 免装:VS/cmake 全在镜像上,CMake 用默认 VS 生成器(cl 由生成
    # 器装配环境,免 vcvars),protoc 不需要(nightly 不重生成 gencode)。

    - name: Setup vcpkg
      shell: bash
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        if [ "${{ runner.os }}" = "Windows" ]; then
          ./vcpkg/bootstrap-vcpkg.bat
        else
          ./vcpkg/bootstrap-vcpkg.sh
        fi

    # vcpkg.json 的 builtin-baseline 里 libsodium 最高 1.0.21,其 ipcrypt 的
    # ARM NEON 路径在 GCC(aarch64) 下因向量类型混用编不过(上游 1.0.22-RELEASE
    # 已修,BYTESHL128 的 s8→u8 与 pfx_shift_left 的 BlockVec→uint8x16_t)。
    # 把 master 上的 1.0.22 端口以 overlay 叠给所有腿(基线不动,overlay 随
    # nightly 的 vcpkg master clone 一起浮动)。注意 overlay 要给两处:
    # 显式安装步(--overlay-ports)与 CMake 工具链的清单安装
    # (-DVCPKG_OVERLAY_PORTS,不带会回落基线 1.0.21 在 arm64 上重炸)。
    - name: Install vcpkg dependencies
      shell: bash
      run: |
        mkdir -p overlay-ports
        cp -r vcpkg/ports/libsodium overlay-ports/
        ./vcpkg/vcpkg install --triplet ${{ matrix.vcpkg_triplet }} \
          --overlay-ports="${{ github.workspace }}/overlay-ports"

    # Same configure recipe as ci.yml / cmake-multi-platform.yml; the build
    # then asks for the SDK targets only. Windows uses the default VS
    # generator (no -G Ninja; --config picks Release), mac/linux use Ninja.
    # No gen_proto.sh here: the committed proto/cpp gencode is what ships in
    # the artifact, and drift is already gated by CI.
    - name: Configure CMake
      shell: bash
      run: |
        ARGS=(-B build -S . -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF
              -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/overlay-ports"
              -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake")
        if [ "${{ runner.os }}" != "Windows" ]; then
          ARGS+=(-G Ninja)
        fi
        cmake "${ARGS[@]}"

    # --parallel 由 cmake 自算逻辑核数(-j$(nproc) 的可移植等价:mac/win 无
    # nproc);--config 对单配置生成器无害。Linux 腿加编 crashpad handler
    # 复制目标(CHIRP_ENABLE_CRASHPAD 仅 Linux 开,build/crashpad_handler
    # 平铺进 cpp 包 bin/;darwin/windows 无此目标)。
    - name: Build chirp_core_sdk (shared + static)
      shell: bash
      # shellcheck disable=SC2086  # targets 是受控词表,需要分词
      run: |
        targets="chirp_core_sdk chirp_core_sdk_static"
        if [ "${{ runner.os }}" = "Linux" ]; then
          targets="$targets chirp_crashpad_handler_copy"
        fi
        cmake --build build --target $targets --config Release --parallel

    - name: Setup Go
      if: matrix.host_sdks
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Verify Go SDK
      if: matrix.host_sdks
      run: |
        go vet ./sdks/go/... ./proto/go/...
        go build ./sdks/go/...

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: apps/desktop/package-lock.json

    - name: Install desktop npm dependencies
      working-directory: apps/desktop
      run: npm ci

    # 桌面 tauri build 会把 ../../proto/ts/proto/*.ts 一起编进去,那些文件
    # 的 import(long/protobufjs)从文件所在目录向上找 node_modules——只有根
    # 安装能接住,所以根 npm ci 四条腿都要跑(x64 腿独跑时 arm 桌面构建
    # TS2307 的根因)。Verify/Pack @chirp/protocol 仍只在 x64 腿(一次)。
    - name: Install npm dependencies (root, for @chirp/protocol + desktop build)
      run: npm ci

    # The TS package that ships is validated by its own suite first, mirroring
    # web.yml's Test @chirp/protocol step.
    - name: Verify @chirp/protocol
      if: matrix.host_sdks
      working-directory: sdks/ts
      run: npm test

    - name: Pack @chirp/protocol
      if: matrix.host_sdks
      working-directory: sdks/ts
      run: npm pack

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.rust_target }}

    # Tauri 的 webkit/gtk 系统依赖只有 Linux 要(macOS 走系统 WebKit,
    # Windows 走镜像预装 WebView2)。
    - name: Install Tauri system dependencies
      if: runner.os == 'Linux'
      run: |
        timeout 900 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update || true
        timeout 900 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

    # 桌面打包目标按平台自动合并(tauri.{macos,windows}.conf.json):
    # linux .deb / darwin .app+.dmg / windows NSIS -setup.exe。
    - name: Build desktop app
      working-directory: apps/desktop
      shell: bash
      run: |
        npm run tauri build
        # Verify the bundle for this leg's platform/architecture
        case "$(uname -s)" in
        Linux)
          ls -la src-tauri/target/release/bundle/deb/Chirp_*.deb
          ;;
        Darwin)
          ls -la src-tauri/target/release/bundle/dmg/*.dmg
          ;;
        *)
          ls -la src-tauri/target/release/bundle/nsis/*-setup.exe
          ;;
        esac

    - name: Assemble leg tree
      shell: bash
      run: |
        set -eux
        arch="${{ matrix.arch }}"
        leg="leg"
        stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
        echo "stamp=$stamp" >> "$GITHUB_ENV"

        # ---- cpp/<arch> ----------------------------------------------------
        cpp="$leg/cpp/$arch"
        mkdir -p "$cpp/lib" "$cpp/include" "$cpp/proto"

        # 库文件按平台命名/落位:linux .so/.a;darwin .dylib/.a;windows
        # VS 多配置生成器产物在 Release/ 下,import lib 进 lib/,dll 与
        # vcpkg 运行时依赖(protobuf/abseil 动态族)一起进 bin/——dll 不
        # 随包走,消费者链接 chirp_core_sdk.lib 后运行期找不到依赖是
        # Windows 上最典型的暗坑。
        cpp_handler_note=""
        case "$(uname -s)" in
        Linux)
          cp -v build/sdks/core/libchirp_core_sdk.so "$cpp/lib/"
          cp -v build/sdks/core/libchirp_core_sdk_static.a "$cpp/lib/"
          # crashpad handler 平铺进 bin/:运行时查找序(exe 同目录 → 上溯
          # 4 级)与安装面一致,消费方把 handler 放到自己服务 exe 旁即可
          # 命中;CHIRP_ENABLE_CRASHPAD 仅 Linux,构建步已加编复制目标。
          mkdir -p "$cpp/bin"
          cp -v build/crashpad_handler "$cpp/bin/"
          cpp_files="lib/libchirp_core_sdk.so  共享库
          lib/libchirp_core_sdk_static.a  静态库(协议对象已并入)
          bin/crashpad_handler  独立崩溃采集 handler(Crashpad)"
          cpp_verify="nm -C lib/libchirp_core_sdk_static.a | grep -m3 'chirp::sdk'"
          cpp_handler_note="
        崩溃采集: bin/crashpad_handler 为独立 Crashpad handler 进程(仅 Linux)。
          运行时查找序: 环境变量 CHIRP_CRASH_HANDLER → 可执行文件同目录 →
          从可执行文件位置上溯 4 级。把它放到你的服务可执行文件同目录,或用
          CHIRP_CRASH_HANDLER 指向它;dump 缺省落 ./crash_dumps(--crash_dir
          可改),上传缺省关闭(--crash_upload_url 为空)。"
          ;;
        Darwin)
          cp -v build/sdks/core/libchirp_core_sdk.dylib "$cpp/lib/"
          cp -v build/sdks/core/libchirp_core_sdk_static.a "$cpp/lib/"
          cpp_files="lib/libchirp_core_sdk.dylib      共享库(install_name=@rpath)
          lib/libchirp_core_sdk_static.a  静态库(协议对象已并入)"
          cpp_verify="nm lib/libchirp_core_sdk_static.a | grep -m3 '_ZN5chirp'"
          ;;
        *)
          mkdir -p "$cpp/bin"
          cp -v build/sdks/core/Release/chirp_core_sdk.dll "$cpp/bin/"
          cp -v build/sdks/core/Release/chirp_core_sdk.lib "$cpp/lib/"
          cp -v build/sdks/core/Release/chirp_core_sdk_static.lib "$cpp/lib/"
          cp -v vcpkg_installed/${{ matrix.vcpkg_triplet }}/bin/*.dll "$cpp/bin/"
          cpp_files="bin/chirp_core_sdk.dll           共享库(与依赖 dll 同目录)
          bin/*.dll                        vcpkg 运行时依赖(protobuf/abseil 等)
          lib/chirp_core_sdk.lib           共享库 import lib
          lib/chirp_core_sdk_static.lib    静态库(协议对象已并入)"
          cpp_verify="dumpbin 头两行随便看:lib/chirp_core_sdk_static.lib(或仅检查文件存在)"
          ;;
        esac

        cp -r sdks/core/include/chirp "$cpp/include/"
        # chirp_core_sdk's PUBLIC include surface is three roots (libs/,
        # libs/common/, libs/common/include/); merge the .h trees so a single
        # -I include is the only flag a consumer needs. find+cp 循环而非
        # rsync --prune-empty-dirs:git-bash 无 rsync,macOS 自带 rsync 的
        # 选项面也漂移,POSIX find/bash 三平台同语义。
        merge_tree() {
          # merge_tree <src> <dest> <prune-rel-path-or-empty>
          # 语义对齐旧 rsync「拷目录本身」:find 从 src 的父目录起,路径带
          # 叶名(network/a.h → dest/network/a.h)。dest 相对调用方 CWD,
          # 子 shell cd 前先转绝对。
          local src="$1" dest="$2" prune="$3"
          case "$dest" in
          /*) ;;
          *) dest="${PWD}/${dest}" ;;
          esac
          local base leaf
          base="$(dirname "$src")"
          leaf="$(basename "$src")"
          (
            cd "$base"
            find "$leaf" -name '*.h' | while read -r h; do
              if [ -n "$prune" ]; then
                local rel="${h#"$leaf"/}"
                case "$rel" in
                "$prune"|"$prune"/*) continue ;;
                esac
              fi
              mkdir -p "$dest/$(dirname "$h")"
              cp "$h" "$dest/$h"
            done
          )
        }
        merge_tree libs/network "$cpp/include" ""
        merge_tree libs/common "$cpp/include" "include"
        mkdir -p "$cpp/include/common"
        for h in libs/common/include/common/*.h; do
          cp "$h" "$cpp/include/common/"
        done
        mkdir -p "$cpp/include/proto"
        cp proto/cpp/proto/*.pb.h "$cpp/include/proto/"
        cp proto/*.proto "$cpp/proto/"
        cat > "$cpp/NOTE.txt" <<NOTE
        chirp C++ core SDK - $arch (daily build)

        包内容:
          $cpp_files
          include/chirp/                  SDK 公开头文件(sdk_client.h 等)
          include/network/, include/common/, include/proto/
                                          依赖的 libs 头与 protobuf 生成头
                                          (chirp_core_sdk 的 PUBLIC include 面)
          proto/*.proto                   协议源文件(可用其他语言插件再生成)
        $cpp_handler_note
        链接: 编译加 -I include,静态/动态二选一;编译/运行依赖
        protobuf、abseil 与 header-only 的 asio(vcpkg.json baseline
        提供的版本;windows 包的 bin/ 已附运行时 dll)。

        验证命令(应列出若干 chirp::sdk 符号):
          $cpp_verify

        警示: 产物未签名;每日构建只证明"能编译+SDK 自身测试通过",
        完整质量门禁以仓库 CI(ci.yml 等)为准。仅供集成联调。
        NOTE

        # ---- desktop/<arch> ------------------------------------------------
        desktop="$leg/desktop/$arch"
        mkdir -p "$desktop"
        case "$(uname -s)" in
        Linux)
          cp -v apps/desktop/src-tauri/target/release/bundle/deb/Chirp_*.deb "$desktop/"
          desktop_note="Chirp_<version>_<dpkg-arch>.deb   Debian 包

        依赖: libwebkit2gtk-4.1-0, libgtk-3-0

        安装: sudo dpkg -i Chirp_*.deb; sudo apt-get install -f
        (或用仓库根 install.sh 一键安装——无 root 时自动解包进 ~/.local)

        验证命令(应列出包元数据):
          dpkg-deb -I Chirp_*.deb"
          ;;
        Darwin)
          cp -v apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg "$desktop/"
          desktop_note="Chirp_<version>_<arch>.dmg       磁盘镜像(内含 Chirp.app)

        安装: 双击挂载后拖入 Applications
        (或用仓库根 install.sh 一键安装——自动挂载拷贝 .app)

        验证命令(应列出镜像内容):
          hdiutil imageinfo Chirp_*.dmg | head -5"
          ;;
        *)
          cp -v apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "$desktop/"
          desktop_note="Chirp_<version>_<arch>-setup.exe  NSIS 安装器

        安装: 双击;静默安装加参数 /S
        (或用仓库根 install.ps1 一键安装——自动下载静默装并验证落位)

        验证命令(应列出安装器元数据):
          powershell -c \"(Get-Item 'Chirp_*-setup.exe').VersionInfo | Format-List\""
          ;;
        esac
        cat > "$desktop/NOTE.txt" <<NOTE
        chirp Desktop App - $arch (daily build)

        包内容:
          $desktop_note

        警示: 产物未签名(darwin 未公证,首启被 Gatekeeper 拦截时右键选
        「打开」);仅供集成联调。
        NOTE

        # ---- go / ts(只在 x64 腿装配一次,产物与架构无关)--------------------
        # 注意: heredoc 内容与终止符一律顶格(bash 的 << 终止符不吃缩进;
        # if 块内的整段语句不能为了可读性多缩进两格)。
        if [ "${{ matrix.host_sdks }}" = "true" ]; then
        go_dir="$leg/go"
        mkdir -p "$go_dir/sdks/go" "$go_dir/proto/go"
        cp -r sdks/go/* "$go_dir/sdks/go/"
        cp -r proto/go/* "$go_dir/proto/go/"
        cp go.mod go.sum "$go_dir/"
        cat > "$go_dir/NOTE.txt" <<'NOTE'
        chirp Go SDK(服务端平面)- 每日构建

        包内容:
          sdks/go/    SDK 源码
          proto/go/   protobuf 生成物
          go.mod / go.sum
                      仓库是单一 Go module(github.com/cui/chirp):把本目录
                      内容放到 module 根(或并入你的 module 后调整 module 名),
                      import "github.com/cui/chirp/sdks/go"。

        验证命令(需要网络拉取 protobuf 依赖):
          go build ./sdks/go/...

        警示: 产物未签名;仅供集成联调。
        NOTE

        ts_dir="$leg/ts"
        mkdir -p "$ts_dir"
        cp -v sdks/ts/chirp-protocol-*.tgz "$ts_dir/"
        cat > "$ts_dir/NOTE.txt" <<'NOTE'
        chirp TS 协议栈(@chirp/protocol)- 每日构建

        包内容:
          chirp-protocol-<version>.tgz   npm pack 产物(src/ 源码 + package.json,
                                         依赖 long / protobufjs 由安装方解析)

        安装: npm install <tgz 路径>;入口见包内 README(web/小游戏/Cocos/
        LayaAir 共用,微信小游戏配 adapters/wx_socket)。

        验证命令(应列出 src/ 文件清单):
          tar -tzf chirp-protocol-*.tgz | head

        警示: 产物未签名;仅供集成联调。
        NOTE
        fi

        find "$leg" -type f | sort

    - uses: actions/upload-artifact@v4
      with:
        name: daily-leg-${{ matrix.arch }}
        path: leg
        if-no-files-found: error

  package:
    # 汇总各腿 → daily-build artifact(既有外部契约,run 页可下)+ 推
    # nightly-dist 镜像分支(一键安装的匿名下载源)+ 滚动 nightly Release
    # (交付面)。linux-x64 腿必须成功(go/ts 源头);其余腿失败时降级发布,
    # manifest 如实记录可用面。
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    # Release notes 的最近提交摘要要走 git log(48h 窗口 + 回落最近 10 条),
    # 浅取 200 条足够;工作区此前为空,checkout 不与 stage/dist 冲突。
    - name: Checkout (release notes commit history)
      uses: actions/checkout@v7
      with:
        fetch-depth: 200

    - name: Download linux-x64 leg (required)
      uses: actions/download-artifact@v4
      with:
        name: daily-leg-linux-x64
        path: stage

    - name: Download linux-arm64 leg (optional — degraded publish when red)
      uses: actions/download-artifact@v4
      with:
        name: daily-leg-linux-arm64
        path: stage
      continue-on-error: true
      id: arm_leg

    - name: Download darwin-arm64 leg (optional — degraded publish when red)
      uses: actions/download-artifact@v4
      with:
        name: daily-leg-darwin-arm64
        path: stage
      continue-on-error: true
      id: darwin_leg

    - name: Download windows-x64 leg (optional — degraded publish when red)
      uses: actions/download-artifact@v4
      with:
        name: daily-leg-windows-x64
        path: stage
      continue-on-error: true
      id: windows_leg

    - name: Assemble dist tree (fixed names for the install mirror)
      run: |
        set -eux
        stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
        built="$(date -u '+%Y-%m-%d %H:%M UTC')"
        dist="dist"
        mkdir -p "$dist/cpp" "$dist/desktop"

        # 固定文件名(安装脚本不追版本号):cpp 打成单 tarball(windows 腿
        # 多一个 bin/ 目录),桌面按平台改名为 .deb/.dmg/-setup.exe,ts tgz
        # 定名 chirp-protocol.tgz(npm install 认文件不认名)。
        for arch_dir in stage/cpp/*/; do
          if [ ! -d "$arch_dir" ]; then continue; fi
          arch="$(basename "$arch_dir")"
          items="lib include proto NOTE.txt"
          if [ -d "stage/cpp/$arch/bin" ]; then
            items="lib include proto bin NOTE.txt"
          fi
          # shellcheck disable=SC2086  # items 是受控词表,需要分词
          tar czf "$dist/cpp/chirp-cpp-sdk-$arch.tar.gz" -C "stage/cpp/$arch" \
            --transform "s|^|chirp-cpp-sdk/|" $items
        done
        for arch_dir in stage/desktop/*/; do
          if [ ! -d "$arch_dir" ]; then continue; fi
          arch="$(basename "$arch_dir")"
          mkdir -p "$dist/desktop/$arch"
          case "$arch" in
          linux-*)
            cp -v "stage/desktop/$arch"/Chirp_*.deb \
              "$dist/desktop/$arch/chirp-desktop-$arch.deb"
            ;;
          darwin-*)
            cp -v "stage/desktop/$arch"/*.dmg \
              "$dist/desktop/$arch/chirp-desktop-$arch.dmg"
            ;;
          windows-*)
            cp -v "stage/desktop/$arch"/*-setup.exe \
              "$dist/desktop/$arch/chirp-desktop-$arch-setup.exe"
            ;;
          esac
        done
        if [ -d "stage/go" ]; then
          mkdir -p "$dist/go"
          tar czf "$dist/go/chirp-go-sdk.tar.gz" -C stage/go sdks proto go.mod go.sum NOTE.txt
        fi
        if [ -d "stage/ts" ]; then
          mkdir -p "$dist/ts"
          cp -v stage/ts/chirp-protocol-*.tgz "$dist/ts/chirp-protocol.tgz"
        fi

        # manifest:一键安装的可用面清单(架构探测失败时报这里)。cpp 的
        # 产物是 dist/cpp/ 下平铺的 tarball 文件名带架构;desktop 是按架构
        # 分目录——两处推导口径不同,别混。
        cpp_archs=""
        if [ -d "$dist/cpp" ]; then
          cpp_archs="$(find "$dist/cpp" -name '*.tar.gz' -printf '%f\n' \
            | sed 's/chirp-cpp-sdk-//; s/\.tar\.gz//' | sort | tr '\n' ' ')"
        fi
        desktop_archs=""
        if [ -d "$dist/desktop" ]; then
          desktop_archs="$(for d in "$dist/desktop"/*/; do basename "$d"; done | sort | tr '\n' ' ')"
        fi
        python3 - "$dist/manifest.json" <<PY
        import json, sys
        cpp = "${cpp_archs}".split()
        desktop = "${desktop_archs}".split()
        comps = {"cpp": cpp, "desktop": desktop, "go": ["any"], "ts": ["any"]}
        comps = {k: v for k, v in comps.items() if v}
        json.dump({
            "stamp": "$stamp",
            "commit": "$GITHUB_SHA",
            "built": "$built",
            "components": comps,
        }, open(sys.argv[1], "w"))
        PY

        cat > "$dist/README.txt" <<README
        chirp daily build
        =================
        stamp:  $stamp
        commit: $GITHUB_SHA
        built:  $built (GitHub Actions nightly)

        内容:
          cpp/<arch>/chirp-cpp-sdk-<arch>.tar.gz   C++ core SDK(库+头+proto 源,Linux 含 crashpad_handler)
          desktop/<arch>/chirp-desktop-<arch>.*    桌面聊天 App
              linux: .deb / darwin: .dmg / windows: -setup.exe
          go/chirp-go-sdk.tar.gz                   Go 服务端 SDK 源码包
          ts/chirp-protocol.tgz                    @chirp/protocol npm 包
          manifest.json                            可用面清单(一键安装读它)
          SHA256SUMS                               全部资产 sha256(sha256sum -c)

        分发(两路):
          - 本 run 页 -> Artifacts -> daily-build(固定名,覆盖旧一份);
          - nightly-dist 分支镜像(本树的逐文件直链,匿名可下):
            https://github.com/cuihairu/chirp/tree/nightly-dist
          一键安装(仓库根脚本,自动选平台产物):
            curl -fsSL https://raw.githubusercontent.com/cuihairu/chirp/main/install.sh | bash
            irm https://raw.githubusercontent.com/cuihairu/chirp/main/install.ps1 | iex
        警示: 全部产物未签名。打包前的验证 = C++ SDK 目标编译 +
        go vet/build + @chirp/protocol 测试套件 + 桌面 App Tauri 构建;完整门禁以仓库 CI 为准。
        README
        find "$dist" -type f | sort

    # 全部资产按文件名(不含目录)出 sha256 清单:Release/ nightly-dist/
    # artifact 三路同名,下载后同目录 `sha256sum -c SHA256SUMS` 即验。
    # 生成走临时文件再 mv——目录扫描与清单写入同一管道会自食(SHA256SUMS
    # 先被重定向建出来,find 再撞见它,shellcheck SC2094 同因)。
    - name: Generate SHA256SUMS
      run: |
        cd dist
        out="$(mktemp)"
        find . -type f ! -name SHA256SUMS | sort | while read -r f; do
          sha256sum "$f" | awk -v f="$f" '{n=split(f,a,"/"); print $1"  "a[n]}'
        done > "$out"
        mv "$out" SHA256SUMS
        cat SHA256SUMS

    - uses: actions/upload-artifact@v4
      with:
        name: daily-build
        path: dist
        if-no-files-found: error
        overwrite: true
        retention-days: 14

    - name: Push nightly-dist mirror branch
      run: |
        set -eux
        stamp="$(python3 -c "import json; print(json.load(open('dist/manifest.json'))['stamp'])")"
        git config --global user.name "chirp-nightly"
        git config --global user.email "actions@users.noreply.github.com"
        git init mirror
        git -C mirror checkout -b nightly-dist
        cp -r dist/. mirror/
        git -C mirror add -A
        git -C mirror commit -m "nightly $stamp (${{ github.sha }})"
        git -C mirror push --force \
          "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
          nightly-dist

    # 滚动 nightly Release(交付面,参照 memex 形态):固定 tag,release 长存、
    # 资产清旧传新、notes 每次重写(--prerelease --latest=false,不抢正式
    # release 位)。资产 = dist 全部文件(文件名全局唯一,含 SHA256SUMS)。
    - name: Update rolling nightly Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        read -r stamp built <<META
        $(python3 -c "import json; m=json.load(open('dist/manifest.json')); print(m['stamp'], m['built'])")
        META
        comps="$(python3 -c "import json; print(' · '.join(k+': '+'/'.join(v) for k,v in json.load(open('dist/manifest.json'))['components'].items()))")"
        sha7="${GITHUB_SHA::7}"
        subject="$(git log -1 --format=%s)"
        # 最近提交摘要:近 48h(与 schedule 节奏一致);仓库静止期回落最近 10 条。
        commits="$(git log --since='48 hours ago' --no-merges --pretty=format:'- %h %s')"
        if [ -z "$commits" ]; then
          commits="$(git log -10 --no-merges --pretty=format:'- %h %s')"
        fi

        notes="$(mktemp)"
        {
          echo "## chirp Nightly(每日构建)"
          echo
          echo "- 构建:${built} · stamp \`${stamp}\`"
          echo "- 提交:\`${sha7}\` ${subject}(main @ \`${GITHUB_SHA}\`)"
          echo "- 可用面:${comps}"
          echo
          echo "## 最近提交"
          echo
          echo "${commits}"
          echo
          echo "## 产物"
          echo
          echo "| 资产 | 大小 | 说明 |"
          echo "| --- | --- | --- |"
          for f in $(find dist -type f | sort); do
            b="$(basename "$f")"
            sz="$(du -h "$f" | cut -f1)"
            case "$b" in
            SHA256SUMS) note="全部资产 sha256 清单" ;;
            manifest.json) note="可用面清单(一键安装读它)" ;;
            README.txt) note="产物说明与逐资产验证命令" ;;
            chirp-cpp-sdk-*) note="C++ core SDK(库+头+proto 源,Linux 含 crashpad_handler)" ;;
            chirp-desktop-*.deb) note="桌面 App(Debian 包)" ;;
            chirp-desktop-*.dmg) note="桌面 App(磁盘镜像,内含 Chirp.app)" ;;
            chirp-desktop-*-setup.exe) note="桌面 App(NSIS 安装器)" ;;
            chirp-go-sdk.tar.gz) note="Go 服务端 SDK 源码包" ;;
            chirp-protocol.tgz) note="@chirp/protocol npm 包" ;;
            *) note="" ;;
            esac
            echo "| \`${b}\` | ${sz} | ${note} |"
          done
          echo
          echo "## 校验"
          echo
          echo "资产与 \`SHA256SUMS\` 放同一目录后:"
          echo
          echo "    sha256sum -c SHA256SUMS          # Linux"
          echo "    shasum -a 256 -c SHA256SUMS      # macOS"
          echo "    # Windows(PowerShell):Get-Hash 逐资产比对 SHA256SUMS"
          echo
          echo "## 一键安装"
          echo
          echo "    # Linux / macOS(自动探测平台/架构;直链源 nightly-dist 镜像)"
          echo "    curl -fsSL https://raw.githubusercontent.com/cuihairu/chirp/main/install.sh | bash"
          echo "    # Windows(PowerShell)"
          echo "    irm https://raw.githubusercontent.com/cuihairu/chirp/main/install.ps1 | iex"
          echo
          echo "## 说明"
          echo
          echo "- 滚动发布:tag 固定 \`nightly\`,资产随最新 main 清旧传新;本页即每日构建交付面(run 页 Artifacts → daily-build 与 nightly-dist 分支镜像同内容,逐资产验证命令见资产内 README.txt)。"
          echo "- 产物未签名(darwin 首启被 Gatekeeper 拦时右键「打开」);每日构建只证明可构建 + SDK 自身测试通过,完整质量门禁以仓库 CI 为准。"
        } > "$notes"

        TAG=nightly
        if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Nightly · 每日构建" \
            --notes "初始化" --prerelease --latest=false
        fi
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
          --jq '.assets[].name' | while read -r a; do
          if [ -n "$a" ]; then
            gh release delete-asset "$TAG" "$a" \
              --repo "$GITHUB_REPOSITORY" --yes
          fi
        done
        # shellcheck disable=SC2046  # dist 内文件名受控、无空白
        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" $(find dist -type f | sort)
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
          --title "Nightly · 每日构建 ${stamp}" \
          --notes-file "$notes" --prerelease --latest=false
