# 构建并推送 chirp 镜像到 GHCR(部署链上游):
#   - ghcr.io/cuihairu/chirp-server  服务端多服务单镜像(ARG SERVICE 选二进制,
#     compose 以 command 分角色;多阶段构建,runtime 非 root)
#   - ghcr.io/cuihairu/chirp-web     web 伴侣(nginx 托管 vite 产物 + /ws/* 同源反代)
# 触发:main 上服务端/web 面改动 + 手动。标签:latest、main、<短SHA>、YYYYMMDD。
# 单 amd64——演示栈只跑在 x64 runner-docker 机上;C++ 交叉 qemu 构建不值当。
# 部署侧(拉镜像起栈+健康检查+回滚)见 .github/workflows/deploy-docker.yml。
name: Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'proto/**'
      - 'libs/**'
      - 'apps/web_companion/**'
      - 'apps/shared/protocol/**'
      - 'deployments/docker/**'
      - 'docker/**'
      - 'scripts/init_db.sql'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'gen_proto.sh'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-server:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        timeout-minutes: 3
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chirp-server
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push (server)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        timeout-minutes: 3
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chirp-web
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
