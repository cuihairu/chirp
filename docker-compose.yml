services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: chirp_password
      MYSQL_DATABASE: chirp
      MYSQL_USER: chirp
      MYSQL_PASSWORD: chirp_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  app_auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app_auth
    # --allow_scaffold_login keeps the dev demo working: the scaffold logins
    # (token == user_id) used by the demo clients are rejected once the auth
    # service enforces real credentials. Production setups drop this flag.
    command: ["--port", "6000", "--jwt_secret", "dev_secret", "--allow_scaffold_login", "1"]
    ports:
      - "6000:6000"

  game_sdk_gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: game_sdk_gateway
    command:
      [
        "--port", "5000",
        "--ws_port", "5001",
        "--auth_host", "app_auth",
        "--auth_port", "6000",
        "--redis_host", "redis",
        "--redis_port", "6379",
        "--redis_ttl", "3600",
        "--instance_id", "gw_1"
      ]
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      - app_auth
      - redis

  chat:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat_enhanced
    command: ["--port", "7000", "--ws_port", "7001", "--redis_host", "redis", "--redis_port", "6379", "--mysql_host", "mysql", "--mysql_port", "3306", "--mysql_database", "chirp", "--mysql_user", "chirp", "--mysql_password", "chirp_pass", "--server_gateway_host", "game_server_gateway", "--server_gateway_secret", "chat-secret", "--gateway_service_secret", "edge-secret", "--npc_service_id", "npc_dialog"]
    ports:
      - "7000:7000"
      - "7001:7001"
    depends_on:
      - redis
      - mysql
      - game_server_gateway

  social:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: social
    command: ["--port", "8000", "--ws_port", "8001", "--redis_host", "redis", "--redis_port", "6379"]
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - redis

  party:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: party
    command: ["--port", "7500", "--ws_port", "7501", "--redis_host", "redis", "--redis_port", "6379"]
    ports:
      - "7500:7500"
      - "7501:7501"
    depends_on:
      - redis

  voice:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: voice
    # turn URIs resolve inside the compose network only ("coturn" is the
    # service name below); the static secret must equal coturn's
    # --static-auth-secret (REST short-term credentials).
    command:
      [
        "--port", "9000",
        "--ws_port", "9001",
        "--turn_uri", "turn:coturn:3478?transport=udp,turn:coturn:3478?transport=tcp,stun:coturn:3478",
        "--turn_static_secret", "dev_turn_secret",
        "--heartbeat_timeout_ms", "75000"
      ]
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      - coturn

  app_notification:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app_notification
    command: ["--port", "5006", "--ws_port", "5016"]
    ports:
      - "5006:5006"
      - "5016:5016"

  app_sdk_gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app_sdk_gateway
    command:
      [
        "--port", "5200",
        "--ws_port", "5201",
        "--auth_host", "app_auth",
        "--auth_port", "6000",
        "--redis_host", "redis",
        "--redis_port", "6379",
        "--redis_ttl", "3600",
        "--instance_id", "app_gw_1",
        "--notification_host", "app_notification",
        "--notification_port", "5006",
        "--chat_host", "chat",
        "--chat_port", "7000",
        "--chat_service_secret", "edge-secret"
      ]
    ports:
      - "5200:5200"
      - "5201:5201"
    depends_on:
      - app_auth
      - redis
      - app_notification
      - chat

  search:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: search
    command: ["--port", "5007"]
    ports:
      - "5007:5007"

  game_server_gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: game_server_gateway
    command:
      [
        "--port", "8100",
        "--service", "chat=chat-secret",
        "--service", "npc_dialog=npc-secret",
        "--chat_service_id", "chat"
      ]
    ports:
      - "8100:8100"

  npc_dialog:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: npc_dialog
    command:
      [
        "--server_gateway_host", "game_server_gateway",
        "--server_gateway_port", "8100",
        "--server_gateway_service", "npc_dialog",
        "--server_gateway_secret", "npc-secret"
      ]
    depends_on:
      - game_server_gateway

  chat_archive:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat_enhanced
    profiles: ["archive"]
    environment:
      CHIRP_BIN: /usr/local/bin/archive_chat_redis_loop.sh
    command:
      [
        "--redis_host", "redis",
        "--redis_port", "6379",
        "--interval_secs", "60",
        "--work_dir", "/var/lib/chirp/archive"
      ]
    volumes:
      - archive_data:/var/lib/chirp/archive
    depends_on:
      - redis

  # TURN/STUN relay for the voice service (WebRTC media fallback behind
  # symmetric NAT). use-auth-secret mode: the voice service mints
  # username/credential pairs from --turn_static_secret, which must equal
  # this --static-auth-secret. Dev only — the secret lives in this file.
  coturn:
    image: coturn/coturn:4.6.2
    command:
      [
        "--use-auth-secret",
        "--static-auth-secret", "dev_turn_secret",
        "--realm", "chirp.dev",
        "--listening-port", "3478",
        "--no-tls",
        "--no-dtls",
        "--min-port", "49160",
        "--max-port", "49200",
        "--no-cli",
        "--no-multicast-peers"
      ]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  mysql_data:
  archive_data:
