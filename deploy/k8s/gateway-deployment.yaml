# Kubernetes 部署配置 - Chirp Game Gateway（game 平面边，TCP+WebSocket）
# 镜像构建:
#   docker build -f docker/Dockerfile.service --build-arg SERVICE=game_sdk_gateway -t chirp/gateway:latest .
# 说明: docker-entrypoint.sh 只 exec 二进制并透传 args —— 二进制不读环境变量，
# 全部配置必须走容器 args；本清单原 env 配置从未生效，已改为 args。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirp-gateway
  namespace: chirp
  labels:
    app: chirp-gateway
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chirp-gateway
  template:
    metadata:
      labels:
        app: chirp-gateway
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - chirp-gateway
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z redis-cluster 6379; do echo waiting for redis; sleep 2; done
      - name: wait-for-auth
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z chirp-auth 6000; do echo waiting for auth; sleep 2; done
      containers:
      - name: gateway
        image: chirp/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 5000
          protocol: TCP
        - name: websocket
          containerPort: 5001
          protocol: TCP
        args:
        - --port
        - '5000'
        - --ws_port
        - '5001'
        - --auth_host
        - chirp-auth
        - --auth_port
        - '6000'
        - --redis_host
        - redis-cluster
        - --redis_port
        - '6379'
        - --redis_ttl
        - '3600'
        - --chat_host
        - chirp-chat
        - --chat_port
        - '7000'
        - --chat_service_secret
        - game-secret
        - --search_host
        - chirp-search
        - --search_port
        - '5007'
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: chirp-gateway
  namespace: chirp
  labels:
    app: chirp-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - name: tcp
    port: 5000
    targetPort: 5000
    protocol: TCP
  - name: websocket
    port: 5001
    targetPort: 5001
    protocol: TCP
  selector:
    app: chirp-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chirp-gateway-hpa
  namespace: chirp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chirp-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chirp-gateway-pdb
  namespace: chirp
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: chirp-gateway
