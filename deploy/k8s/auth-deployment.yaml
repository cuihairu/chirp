# Kubernetes 部署配置 - Chirp Auth Service（app 平面认证，增强版目标 app_auth）
# 镜像构建（compose 的 build 不打 tag，k8s 需要预先 tag 好的镜像）:
#   docker build -f docker/Dockerfile.service --build-arg SERVICE=app_auth -t chirp/auth:latest .
# 说明: docker-entrypoint.sh 只 exec 二进制并透传 args —— 二进制不读环境变量，
# 全部配置必须走容器 args（与 docker-compose.cluster.yml 的 command 同源）。

apiVersion: v1
kind: Service
metadata:
  name: chirp-auth
  namespace: chirp
  labels:
    app: chirp-auth
spec:
  selector:
    app: chirp-auth
  ports:
  - name: tcp
    port: 6000
    targetPort: 6000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirp-auth
  namespace: chirp
  labels:
    app: chirp-auth
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chirp-auth
  template:
    metadata:
      labels:
        app: chirp-auth
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mysql-primary 3306; do echo waiting for mysql; sleep 2; done;']
      containers:
      - name: auth
        image: chirp/auth:latest
        imagePullPolicy: IfNotPresent
        # 不带 mysql 参数时进程默认连 127.0.0.1:3306（Pod 内不存在），必须显式指到 mysql。
        args:
        - "--port"
        - "6000"
        - "--jwt_secret"
        - "production_jwt_secret_change_me"
        - "--mysql_host"
        - "mysql-primary"
        - "--mysql_port"
        - "3306"
        - "--mysql_user"
        - "chirp"
        - "--mysql_password"
        - "chirp_password_change_me"
        - "--mysql_database"
        - "chirp"
        ports:
        - name: tcp
          containerPort: 6000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 6000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 6000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
