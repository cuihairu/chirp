# Kubernetes 部署配置 - Chirp Party Service（Redis 快照，参与者态）
# 镜像构建:
#   docker build -f docker/Dockerfile.service --build-arg SERVICE=party -t chirp/party:latest .
# 说明: docker-entrypoint.sh 只 exec 二进制并透传 args —— 二进制不读环境变量，
# 全部配置必须走容器 args（与 docker-compose.cluster.yml 的 command 同源）。

apiVersion: v1
kind: Service
metadata:
  name: chirp-party
  namespace: chirp
  labels:
    app: chirp-party
spec:
  selector:
    app: chirp-party
  ports:
  - name: tcp
    port: 7500
    targetPort: 7500
  - name: websocket
    port: 7501
    targetPort: 7501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirp-party
  namespace: chirp
  labels:
    app: chirp-party
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chirp-party
  template:
    metadata:
      labels:
        app: chirp-party
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis-cluster 6379; do echo waiting for redis; sleep 2; done;']
      containers:
      - name: party
        image: chirp/party:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--port"
        - "7500"
        - "--ws_port"
        - "7501"
        - "--token_secret"
        - "production_jwt_secret_change_me"
        - "--redis_host"
        - "redis-cluster"
        - "--redis_port"
        - "6379"
        ports:
        - name: tcp
          containerPort: 7500
          protocol: TCP
        - name: websocket
          containerPort: 7501
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 7500
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 7500
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
