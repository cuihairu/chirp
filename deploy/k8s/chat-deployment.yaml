# Kubernetes 部署配置 - Chirp Chat Service（分布式，MessageRouter + Redis）
# 镜像构建:
#   docker build -f docker/Dockerfile.service --build-arg SERVICE=chat_distributed -t chirp/chat:latest .
# 说明: docker-entrypoint.sh 只 exec 二进制并透传 args —— 二进制不读环境变量，
# 全部配置必须走容器 args；本清单原 env 配置从未生效，已改为 args。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirp-chat
  namespace: chirp
  labels:
    app: chirp-chat
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chirp-chat
  template:
    metadata:
      labels:
        app: chirp-chat
        version: v1
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - chirp-chat
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z redis-cluster 6379; do echo waiting for redis; sleep 2; done;
      - name: wait-for-mysql
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z mysql-primary 3306; do echo waiting for mysql; sleep 2; done;
      containers:
      - name: chat
        image: chirp/chat:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: tcp
          containerPort: 7000
          protocol: TCP
        - name: websocket
          containerPort: 7001
          protocol: TCP
        args:
        - --port
        - '7000'
        - --ws_port
        - '7001'
        - --token_secret
        - production_jwt_secret_change_me
        - --redis_host
        - redis-cluster
        - --redis_port
        - '6379'
        - --offline_ttl
        - '604800'
        - --gateway_service_secret
        - game-secret
        - --server_gateway_host
        - chirp-server-gateway
        - --server_gateway_port
        - '8100'
        - --server_gateway_secret
        - chat-secret
        - --npc_service_id
        - npc_dialog
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 2000m
        livenessProbe:
          tcpSocket:
            port: 7000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 7000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: chirp-chat
  namespace: chirp
  labels:
    app: chirp-chat
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: tcp
    port: 7000
    targetPort: 7000
    protocol: TCP
  - name: websocket
    port: 7001
    targetPort: 7001
    protocol: TCP
  selector:
    app: chirp-chat
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chirp-chat-hpa
  namespace: chirp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chirp-chat
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chirp-chat-pdb
  namespace: chirp
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: chirp-chat
---
apiVersion: v1
kind: Service
metadata:
  name: chirp-chat
  namespace: chirp
  labels:
    app: chirp-chat
spec:
  selector:
    app: chirp-chat
  ports:
  - name: tcp
    port: 7000
    targetPort: 7000
  - name: websocket
    port: 7001
    targetPort: 7001
