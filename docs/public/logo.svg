<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- 鸟嘴 - 卡通风格，张开的嘴 -->
  <!-- 上喙 -->
  <path d="M200 230 Q220 200 260 195 Q300 190 320 210 L360 220 Q370 225 365 235 L325 240 Q310 245 290 245 Q250 248 220 245 Q200 242 200 230Z" fill="white"/>
  <!-- 下喙 -->
  <path d="M200 250 Q220 260 260 265 Q300 268 320 255 L360 245 Q370 242 365 235 L325 240 Q310 245 290 245 Q250 248 220 250 Q200 252 200 250Z" fill="#e0e0ff" opacity="0.9"/>
  <!-- 嘴巴张开的缝隙 -->
  <path d="M210 245 Q250 250 310 242 Q340 238 360 235" fill="none" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 鼻孔 -->
  <circle cx="280" cy="215" r="4" fill="#4338ca" opacity="0.4"/>
  <!-- 眼睛 - 大而圆，卡通风格 -->
  <circle cx="240" cy="200" r="22" fill="white"/>
  <circle cx="240" cy="200" r="14" fill="#1e1b4b"/>
  <circle cx="246" cy="194" r="6" fill="white"/>
  <!-- 眉毛 -->
  <path d="M218 175 Q240 165 262 172" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- 腮红 -->
  <ellipse cx="215" cy="230" rx="15" ry="10" fill="#f472b6" opacity="0.3"/>
  <!-- 头顶羽毛 -->
  <path d="M230 175 Q225 140 240 120 Q250 145 255 170" fill="white" opacity="0.9"/>
  <path d="M245 170 Q248 135 265 118 Q268 142 262 168" fill="white" opacity="0.7"/>
  <!-- 声波 - 从嘴巴发出 -->
  <path d="M370 215 Q385 215 385 230 Q385 245 370 245" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M388 205 Q410 205 410 230 Q410 255 388 255" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M405 195 Q435 195 435 230 Q435 265 405 265" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
</svg>