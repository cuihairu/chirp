syntax = "proto3";

package chirp.voice;

option go_package = "github.com/cui/chirp/proto/go/voice";

import "proto/common.proto";

// Voice room types
enum RoomType {
  PEER_TO_PEER = 0;    // 1:1 voice call
  GROUP = 1;           // Group voice chat
  CHANNEL = 2;         // Persistent voice channel (like Discord)
}

// Participant state in voice room
enum ParticipantState {
  JOINING = 0;         // Connecting to room
  CONNECTED = 1;       // Connected and can send/receive audio
  MUTED = 2;           // Connected but mic muted
  DEAFENED = 3;        // Connected but speaker muted
  DISCONNECTED = 4;    // Left the room
}

// Host-controlled speaking queue (麦序模式, VOICE-RT): rooms run MIC_FREE
// (the default, everyone may speak) or MIC_MANAGED (only the mic holder
// speaks; the host approves applications off a FIFO queue).
enum MicMode {
  MIC_FREE = 0;
  MIC_MANAGED = 1;
}

// Media delivery tier (大规模旁路分级, VOICE-RT): the server classifies each
// room and the clients configure their engine accordingly - small rooms mix
// every stream, large rooms forward through the SFU bypass.
enum MediaTier {
  FULL_MIX = 0;        // peer mesh with full mixing (small rooms)
  FORWARD_BYPASS = 1;  // SFU forwarding bypass (large rooms)
}

// Create voice room
message CreateRoomRequest {
  string user_id = 1;
  RoomType room_type = 2;
  string room_name = 3;
  int32 max_participants = 4;   // 0 for unlimited
  map<string, string> metadata = 5;
}

message CreateRoomResponse {
  common.ErrorCode code = 1;
  string room_id = 2;
  int64 server_time = 3;
}

// TURN/STUN access for WebRTC gathering, handed out with the join response
// (coturn REST short-term credentials; empty username/credential = STUN only).
message IceServer {
  repeated string urls = 1;      // e.g. "turn:host:3478?transport=udp"
  string username = 2;           // "{unix_expiry}:{user_id}"
  string credential = 3;         // base64(HMAC-SHA1(secret, username))
}

// Join voice room
message JoinRoomRequest {
  string user_id = 1;
  string room_id = 2;
  string sdp_offer = 3;         // WebRTC SDP offer
}

message JoinRoomResponse {
  common.ErrorCode code = 1;
  string room_id = 2;
  string sdp_answer = 3;        // WebRTC SDP answer from server/peer
  repeated string participant_ids = 4;
  int64 server_time = 5;
  repeated IceServer ice_servers = 6;
  // Delivery tier the server picked for this room (VOICE-RT 旁路分级);
  // rtcp_feedback_ms is the tier's receiver-report pacing the engine should
  // use (smaller tier = more frequent feedback for tight mixing).
  MediaTier media_tier = 7;
  int32 rtcp_feedback_ms = 8;
}

// Leave voice room
message LeaveRoomRequest {
  string user_id = 1;
  string room_id = 2;
}

message LeaveRoomResponse {
  common.ErrorCode code = 1;
  int64 server_time = 2;
}

// WebRTC signaling messages
message IceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_mline_index = 3;
}

message IceCandidateMessage {
  string room_id = 1;
  string from_user_id = 2;
  string to_user_id = 3;         // Empty for broadcast to all
  IceCandidate candidate = 4;
}

message SdpOfferMessage {
  string room_id = 1;
  string from_user_id = 2;
  string to_user_id = 3;
  string sdp_offer = 4;
}

message SdpAnswerMessage {
  string room_id = 1;
  string from_user_id = 2;
  string to_user_id = 3;
  string sdp_answer = 4;
}

// Room participant info
message ParticipantInfo {
  string user_id = 1;
  string username = 2;
  ParticipantState state = 3;
  int64 joined_at = 4;
  bool is_speaking = 5;
  // Independent mute flags; `state` is derived from them
  // (DEAFENED > MUTED > CONNECTED) so unmuting the mic while deafened
  // keeps the participant DEAFENED.
  bool muted = 6;
  bool deafened = 7;
}

// Get room info
message GetRoomInfoRequest {
  string room_id = 1;
}

message GetRoomInfoResponse {
  common.ErrorCode code = 1;
  string room_id = 2;
  string room_name = 3;
  RoomType room_type = 4;
  repeated ParticipantInfo participants = 5;
  int32 max_participants = 6;
  // Speaking queue snapshot for late joiners (VOICE-RT 麦序模式).
  MicMode mic_mode = 7;
  string mic_holder_user_id = 8;
  repeated string mic_queue_user_ids = 9;
}

// Get user's current room
message GetUserRoomRequest {
  string user_id = 1;
}

message GetUserRoomResponse {
  common.ErrorCode code = 1;
  string room_id = 2;
  ParticipantInfo participant = 3;
}

// Mute/unmute microphone
message SetMuteRequest {
  string user_id = 1;
  string room_id = 2;
  bool muted = 3;
}

message SetMuteResponse {
  common.ErrorCode code = 1;
  int64 server_time = 2;
}

// Deafen/undeafen speaker
message SetDeafenRequest {
  string user_id = 1;
  string room_id = 2;
  bool deafened = 3;
}

message SetDeafenResponse {
  common.ErrorCode code = 1;
  int64 server_time = 2;
}

// Notifications
message ParticipantJoinedNotify {
  string room_id = 1;
  ParticipantInfo participant = 2;
  int64 timestamp = 3;
}

message ParticipantLeftNotify {
  string room_id = 1;
  string user_id = 2;
  int64 timestamp = 3;
}

message ParticipantStateChangedNotify {
  string room_id = 1;
  string user_id = 2;
  ParticipantState state = 3;
  int64 timestamp = 4;
}

message SpeakingNotify {
  string room_id = 1;
  string user_id = 2;
  bool speaking = 3;
  int64 timestamp = 4;
  // 0-100 loudness level from the client's audio stats (0 when speaking is
  // false); drives the SDK volume callbacks.
  int32 volume = 5;
}

// Set the room's speaking mode (host only).
message SetMicModeRequest {
  string user_id = 1;   // the host
  string room_id = 2;
  MicMode mode = 3;
}

// Apply for the mic (managed mode): joins the FIFO queue.
message MicQueueApplyRequest {
  string user_id = 1;
  string room_id = 2;
}

// Host approves the queue head, or a specific applicant.
message MicQueueApproveRequest {
  string user_id = 1;          // the host
  string room_id = 2;
  string target_user_id = 3;   // empty = queue head
}

// The holder (or the host) releases the mic (下麦).
message MicQueueReleaseRequest {
  string user_id = 1;
  string room_id = 2;
}

// Host hands the mic straight to a member (切麦), bypassing the queue.
message MicQueueGrantRequest {
  string user_id = 1;          // the host
  string room_id = 2;
  string target_user_id = 3;
}

// Shared ack for the speaking-queue operations.
message MicQueueResponse {
  common.ErrorCode code = 1;
  int64 server_time = 2;
  string holder_user_id = 3;   // holder after the op
  int32 queue_depth = 4;       // waiting applicants after the op
}

// Broadcast on every mode/holder/queue change.
message MicQueueStateNotify {
  string room_id = 1;
  MicMode mode = 2;
  string holder_user_id = 3;
  repeated string queue_user_ids = 4;
  int64 timestamp = 5;
}
