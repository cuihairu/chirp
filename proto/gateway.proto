// Universal Packet Envelope (Optional, if we want full protobuf wrap)
// Usually we use Length-Prefixed + Raw Bytes for Body, 
// but for simplicity in some SDKs, a full envelope is used.
message Packet {
  MsgID msg_id = 1;
  int64 sequence = 2;
  bytes body = 3;
}

message HeartbeatPing {
  int64 timestamp = 1;
}

message HeartbeatPong {
  int64 timestamp = 1;
  int64 server_time = 2;
}

// ---------------------------------------------------------------------------
// Chat peer registration (docs/architecture.md 对等注册协议). game_chat is the
// spoke, app_chat the hub; registration happens once per connection, and a
// dropped peer connection must re-register.
// ---------------------------------------------------------------------------

// Capability bits exchanged during the handshake. The negotiated set is the
// intersection of both sides; anything outside it stays disabled for the
// session. New capabilities bump protocol_version and add a bit - old peers
// that do not know the bit simply never use it.
enum PeerCapability {
  RELAY_READ_RECEIPTS = 0;
  RELAY_TYPING = 1;
  RELAY_PRESENCE = 2;
  RELAY_OFFLINE_MESSAGES = 3;
}

message PeerRegisterReq {
  string service_id = 1;       // e.g. "game_42"; second registration with the
                               // same id displaces the first connection
  string service_secret = 2;   // shared secret for this peer (checked against
                               // the hub's --allowed_peers list)
  int32 protocol_version = 3;  // negotiated down to min(hub, spoke)
  string game_id = 4;          // namespace for this peer's channels; must not
                               // contain ':' (it prefixes "<game_id>:" on the
                               // hub side)
  repeated PeerCapability supported_features = 5;
}

message PeerRegisterResp {
  chirp.common.ErrorCode code = 1;  // OK / AUTH_FAILED (not whitelisted) /
                                    // VERSION_MISMATCH (below min version)
  int32 protocol_version = 2;       // negotiated version (OK) or hub's
                                    // current version (mismatch)
  int32 min_version = 3;            // hub's minimum accepted version
  int32 heartbeat_interval_seconds = 4;  // hub-assigned cadence; a peer that
                                         // stays silent for ~2x is dropped
  repeated PeerCapability supported_features = 5;  // negotiated intersection
}

// Spoke -> hub: one game-side channel message, fanned out by the hub to every
// subscribed App player as an injected private copy named
// "<game_id>:<channel_id>". The message body is the game-side ChatMessage
// verbatim; channel_id stays bare (the hub adds the prefix).
message ChannelMessageNotify {
  string game_id = 1;  // redundant with the registration for validation
  string channel_id = 2;
  chirp.chat.ChatMessage message = 3;
}

// Hub -> spoke: an App player's reply to a "<game_id>:<channel_id>" channel,
// injected into the game-side channel as a normal message. The spoke never
// sees the App player's player_id - the hub resolves it to a game_user_id
// before sending.
message PeerInjectMessageNotify {
  string channel_id = 1;       // bare game-side channel id
  string sender_id = 2;        // game_user_id resolved from the App player
  bytes content = 3;
  string client_msg_id = 4;    // optional idempotency key from the App client
}
