syntax = "proto3";

package chirp.gateway;

option go_package = "github.com/cui/chirp/proto/go/gateway";

// Message ID definition for dispatching
enum MsgID {
  UNKNOWN = 0;
  HEARTBEAT_PING = 1001;
  HEARTBEAT_PONG = 1002;
  LOGIN_REQ = 1003;
  LOGIN_RESP = 1004;
  KICK_NOTIFY = 1005;
  LOGOUT_REQ = 1006;
  LOGOUT_RESP = 1007;

  // Enhanced auth messages
  REGISTER_REQ = 1008;
  REGISTER_RESP = 1009;
  PASSWORD_LOGIN_REQ = 1010;
  PASSWORD_LOGIN_RESP = 1011;
  REFRESH_TOKEN_REQ = 1012;
  REFRESH_TOKEN_RESP = 1013;
  GET_SESSIONS_REQ = 1014;
  GET_SESSIONS_RESP = 1015;
  REVOKE_SESSION_REQ = 1016;
  REVOKE_SESSION_RESP = 1017;
  CHANGE_PASSWORD_REQ = 1018;
  CHANGE_PASSWORD_RESP = 1019;

  // Chat service
  SEND_MESSAGE_REQ = 2001;
  SEND_MESSAGE_RESP = 2002;
  GET_HISTORY_REQ = 2003;
  GET_HISTORY_RESP = 2004;
  CHAT_MESSAGE_NOTIFY = 2005;

  // Group chat
  CREATE_GROUP_REQ = 2101;
  CREATE_GROUP_RESP = 2102;
  JOIN_GROUP_REQ = 2103;
  JOIN_GROUP_RESP = 2104;
  LEAVE_GROUP_REQ = 2105;
  LEAVE_GROUP_RESP = 2106;
  KICK_MEMBER_REQ = 2107;
  KICK_MEMBER_RESP = 2108;
  GET_GROUP_INFO_REQ = 2109;
  GET_GROUP_INFO_RESP = 2110;
  GET_GROUP_MEMBERS_REQ = 2111;
  GET_GROUP_MEMBERS_RESP = 2112;
  GET_USER_GROUPS_REQ = 2113;
  GET_USER_GROUPS_RESP = 2114;
  INVITE_TO_GROUP_REQ = 2115;
  INVITE_TO_GROUP_RESP = 2116;
  GROUP_CREATED_NOTIFY = 2117;
  GROUP_MEMBER_JOINED_NOTIFY = 2118;
  GROUP_MEMBER_LEFT_NOTIFY = 2119;
  GROUP_MEMBER_KICKED_NOTIFY = 2120;
  GROUP_UPDATED_NOTIFY = 2121;

  // Read receipts
  MARK_READ_REQ = 2201;
  MARK_READ_RESP = 2202;
  GET_READ_RECEIPTS_REQ = 2203;
  GET_READ_RECEIPTS_RESP = 2204;
  GET_UNREAD_COUNT_REQ = 2205;
  GET_UNREAD_COUNT_RESP = 2206;
  MESSAGE_READ_NOTIFY = 2207;

  // Typing indicators
  TYPING_INDICATOR_NOTIFY = 2208;

  // Message delivery tracking
  MESSAGE_ACK = 2209;
  MESSAGE_NACK = 2210;
  TRACK_MESSAGE_REQ = 2211;
  TRACK_MESSAGE_RESP = 2212;

  // Enhanced history
  GET_HISTORY_V2_REQ = 2213;
  GET_HISTORY_V2_RESP = 2214;

  // Message reactions
  ADD_REACTION_REQ = 2215;
  ADD_REACTION_RESP = 2216;
  REMOVE_REACTION_REQ = 2217;
  REMOVE_REACTION_RESP = 2218;
  GET_REACTIONS_REQ = 2219;
  GET_REACTIONS_RESP = 2220;
  REACTION_ADDED_NOTIFY = 2221;
  REACTION_REMOVED_NOTIFY = 2222;

  // Typing queries
  GET_TYPING_USERS_REQ = 2223;
  GET_TYPING_USERS_RESP = 2224;

  // Message edit/delete
  EDIT_MESSAGE_REQ = 2225;
  EDIT_MESSAGE_RESP = 2226;
  DELETE_MESSAGE_REQ = 2227;
  DELETE_MESSAGE_RESP = 2228;
  BULK_DELETE_REQ = 2229;
  BULK_DELETE_RESP = 2230;
  MESSAGE_EDITED_NOTIFY = 2231;
  MESSAGE_DELETED_NOTIFY = 2232;

  // Mentions
  GET_MENTION_SUGGESTIONS_REQ = 2233;
  GET_MENTION_SUGGESTIONS_RESP = 2234;

  // Social service
  ADD_FRIEND_REQ = 3001;
  ADD_FRIEND_RESP = 3002;
  FRIEND_REQUEST_ACTION_REQ = 3003;
  FRIEND_REQUEST_ACTION_RESP = 3004;
  REMOVE_FRIEND_REQ = 3005;
  REMOVE_FRIEND_RESP = 3006;
  GET_FRIEND_LIST_REQ = 3007;
  GET_FRIEND_LIST_RESP = 3008;
  GET_PENDING_REQUESTS_REQ = 3009;
  GET_PENDING_REQUESTS_RESP = 3010;
  BLOCK_USER_REQ = 3011;
  BLOCK_USER_RESP = 3012;
  UNBLOCK_USER_REQ = 3013;
  UNBLOCK_USER_RESP = 3014;
  GET_BLOCKED_LIST_REQ = 3015;
  GET_BLOCKED_LIST_RESP = 3016;
  SET_PRESENCE_REQ = 3017;
  SET_PRESENCE_RESP = 3018;
  GET_PRESENCE_REQ = 3019;
  GET_PRESENCE_RESP = 3020;
  PRESENCE_NOTIFY = 3021;
  FRIEND_REQUEST_NOTIFY = 3022;
  FRIEND_ACCEPTED_NOTIFY = 3023;
  FRIEND_REMOVED_NOTIFY = 3024;

  // Voice service
  CREATE_ROOM_REQ = 4001;
  CREATE_ROOM_RESP = 4002;
  JOIN_ROOM_REQ = 4003;
  JOIN_ROOM_RESP = 4004;
  LEAVE_ROOM_REQ = 4005;
  LEAVE_ROOM_RESP = 4006;
  ICE_CANDIDATE_MSG = 4007;
  SDP_OFFER_MSG = 4008;
  SDP_ANSWER_MSG = 4009;
  GET_ROOM_INFO_REQ = 4010;
  GET_ROOM_INFO_RESP = 4011;
  GET_USER_ROOM_REQ = 4012;
  GET_USER_ROOM_RESP = 4013;
  SET_MUTE_REQ = 4014;
  SET_MUTE_RESP = 4015;
  SET_DEAFEN_REQ = 4016;
  SET_DEAFEN_RESP = 4017;
  PARTICIPANT_JOINED_NOTIFY = 4018;
  PARTICIPANT_LEFT_NOTIFY = 4019;
  PARTICIPANT_STATE_CHANGED_NOTIFY = 4020;
  SPEAKING_NOTIFY = 4021;

  // Server plane: game backend <-> chirp (authenticated services, not users).
  // See proto/server_gateway.proto for the payloads.
  SERVER_AUTH_REQ = 5001;
  SERVER_AUTH_RESP = 5002;
  SERVER_HEARTBEAT_PING = 5003;
  SERVER_HEARTBEAT_PONG = 5004;
  INJECT_MESSAGE_REQ = 5005;
  INJECT_MESSAGE_RESP = 5006;
  INJECT_MESSAGE_NOTIFY = 5007;
  EVENT_PUBLISH_REQ = 5008;
  EVENT_PUBLISH_RESP = 5009;
  EVENT_DELIVER_NOTIFY = 5010;
  EVENT_ACK_REQ = 5011;
  EVENT_ACK_RESP = 5012;
  BIND_PLAYER_IDENTITY_REQ = 5013;
  BIND_PLAYER_IDENTITY_RESP = 5014;
  UNBIND_PLAYER_IDENTITY_REQ = 5015;
  UNBIND_PLAYER_IDENTITY_RESP = 5016;
  GET_PLAYER_IDENTITIES_REQ = 5017;
  GET_PLAYER_IDENTITIES_RESP = 5018;
  RESOLVE_GAME_USER_REQ = 5019;
  RESOLVE_GAME_USER_RESP = 5020;

  // Notification plane: device registration forwarded by app_gateway and
  // push requests from internal services (chat). Bodies are
  // chirp.notification.* messages; see proto/notification.proto.
  REGISTER_DEVICE_REQ = 6001;
  REGISTER_DEVICE_RESP = 6002;
  UNREGISTER_DEVICE_REQ = 6003;
  UNREGISTER_DEVICE_RESP = 6004;
  UPDATE_DEVICE_TOKEN_REQ = 6005;
  UPDATE_DEVICE_TOKEN_RESP = 6006;
  GET_USER_DEVICES_REQ = 6007;
  GET_USER_DEVICES_RESP = 6008;
  PUSH_NOTIFICATION_REQ = 6009;
  PUSH_NOTIFICATION_RESP = 6010;
  // Reserved for later increments: SET_BADGE_COUNT (6011/6012),
  // SILENT_NOTIFICATION (6013/6014), notification preferences (6015-6018).

  // Party plane: cross-game team-up on the player plane (membership and
  // signaling identity are the player, decoupled from the game-scoped voice
  // rooms; see docs/architecture.md). Invite-accept only — no join codes.
  // Bodies are chirp.party.* messages; see proto/party.proto.
  CREATE_PARTY_REQ = 7001;
  CREATE_PARTY_RESP = 7002;
  DISBAND_PARTY_REQ = 7003;
  DISBAND_PARTY_RESP = 7004;
  INVITE_TO_PARTY_REQ = 7005;
  INVITE_TO_PARTY_RESP = 7006;
  INVITE_NOTIFY = 7007;              // to the invitee, all their devices
  ACCEPT_INVITE_REQ = 7008;
  ACCEPT_INVITE_RESP = 7009;
  DECLINE_INVITE_REQ = 7010;
  DECLINE_INVITE_RESP = 7011;
  INVITE_RESULT_NOTIFY = 7012;       // to the inviter (accept/decline)
  LEAVE_PARTY_REQ = 7013;
  LEAVE_PARTY_RESP = 7014;
  KICK_PARTY_MEMBER_REQ = 7015;
  KICK_PARTY_MEMBER_RESP = 7016;
  TRANSFER_LEADER_REQ = 7017;
  TRANSFER_LEADER_RESP = 7018;
  SET_READY_REQ = 7019;
  SET_READY_RESP = 7020;
  PARTY_JOINED_NOTIFY = 7021;        // everyone except the joiner
  PARTY_LEFT_NOTIFY = 7022;          // everyone except the leaver
  PARTY_KICKED_NOTIFY = 7023;        // the kicked user only
  PARTY_STATE_CHANGED_NOTIFY = 7024; // full PartyInfo snapshot, ALL members
  PARTY_DISBANDED_NOTIFY = 7025;     // remaining members on disband
  GET_MY_PARTY_REQ = 7026;
  GET_MY_PARTY_RESP = 7027;
  // Reserved for later increments: GET_MY_INVITES (7028/7029), party
  // settings/roles (703x), invite-expiry sweep notify.
}

// Universal Packet Envelope (Optional, if we want full protobuf wrap)
// Usually we use Length-Prefixed + Raw Bytes for Body, 
// but for simplicity in some SDKs, a full envelope is used.
message Packet {
  MsgID msg_id = 1;
  int64 sequence = 2;
  bytes body = 3;
}

message HeartbeatPing {
  int64 timestamp = 1;
}

message HeartbeatPong {
  int64 timestamp = 1;
  int64 server_time = 2;
}
