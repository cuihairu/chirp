syntax = "proto3";

package chirp.common;

option go_package = "github.com/cui/chirp/proto/go/common";

enum ErrorCode {
  OK = 0;
  INTERNAL_ERROR = 1;
  INVALID_PARAM = 2;
  AUTH_FAILED = 3;
  SESSION_EXPIRED = 4;
  USER_NOT_FOUND = 5;
  TARGET_OFFLINE = 6;
  // Server plane: the target service is not connected (or its queue is full),
  // so the request cannot be forwarded right now.
  SERVER_UNAVAILABLE = 7;
  // The client exceeded a rate limit (e.g. chat direct-entry login/send
  // windows) and should back off before retrying.
  RATE_LIMITED = 8;
  // Trusted-peer plane: the peer's protocol_version is below the hub's
  // minimum (PEER_REGISTER_RESP carries min_version so the peer can upgrade).
  VERSION_MISMATCH = 9;
  // Game-plane word filter (game_chat_features P1 专码): the message hit the
  // lexicon and the configured policy is `reject` (basic/enhanced both).
  WORD_FILTERED = 10;
  // Game-plane per-channel content-length cap (game_chat_features P1 专码):
  // the message exceeded MaxContentChars for its channel type.
  CONTENT_TOO_LONG = 11;
  // Game-plane group mute (game_chat_features P1 专码): the sender is muted
  // in the target group by a MODERATOR+ (SET_GROUP_MUTE_REQ 2250). The send
  // is refused without touching any store; other channels are unaffected.
  MUTED = 12;
  // Game-plane world-channel level gate (game_chat_features P1 专码): the
  // sender's declared level (LoginRequest.level) is below the configured
  // --world_channel_min_level. The send is refused before any budget or
  // store is touched; other channels are unaffected.
  LEVEL_REQUIRED = 13;
  // Game-plane DM restriction (game_chat_features P2 专码): the receiver
  // enabled the stranger-DM switch (SET_DM_RESTRICTION_REQ 2255) and the
  // sender is neither a social-plane friend nor a co-member of any group.
  // The send is refused without touching any store; other channels are
  // unaffected.
  DM_RESTRICTED = 14;
}

message Empty {}
