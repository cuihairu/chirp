syntax = "proto3";

package chirp.common;

option go_package = "github.com/cui/chirp/proto/go/common";

enum ErrorCode {
  OK = 0;
  INTERNAL_ERROR = 1;
  INVALID_PARAM = 2;
  AUTH_FAILED = 3;
  SESSION_EXPIRED = 4;
  USER_NOT_FOUND = 5;
  TARGET_OFFLINE = 6;
  // Server plane: the target service is not connected (or its queue is full),
  // so the request cannot be forwarded right now.
  SERVER_UNAVAILABLE = 7;
  // The client exceeded a rate limit (e.g. chat direct-entry login/send
  // windows) and should back off before retrying.
  RATE_LIMITED = 8;
  // Trusted-peer plane: the peer's protocol_version is below the hub's
  // minimum (PEER_REGISTER_RESP carries min_version so the peer can upgrade).
  VERSION_MISMATCH = 9;
  // Game-plane word filter (game_chat_features P1 专码): the message hit the
  // lexicon and the configured policy is `reject` (basic/enhanced both).
  WORD_FILTERED = 10;
  // Game-plane per-channel content-length cap (game_chat_features P1 专码):
  // the message exceeded MaxContentChars for its channel type.
  CONTENT_TOO_LONG = 11;
}

message Empty {}
