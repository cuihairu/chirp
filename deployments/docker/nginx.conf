# chirp web 伴侣反代:静态 SPA + 同源 /ws/* 升级转发到 compose 内各服务。
# 浏览器默认按 window.location.host 拼 wss://…/ws/<plane>(services.ts),
# 不带 VITE_* 构建即同源模式。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 聊天长连接:读/写空闲拉长,防反代侧掐线(客户端自有心跳重连兜底)。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /ws/chat   { proxy_pass http://chat:7001; }
    location /ws/social { proxy_pass http://social:8001; }
    location /ws/party  { proxy_pass http://party:7501; }
    location /ws/voice  { proxy_pass http://voice:9001; }
    location /ws/device { proxy_pass http://app_sdk_gateway:5201; }

    # SPA 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
