<!DOCTYPE html>
<!-- chirp 手机端原型 · 09 设备(补稿,2026-11-28 步骤二)
     布局:顶栏(返回 + 设备 + 服务态副标题)→ 「本设备」卡(机型/平台 + 推送注册态)→
          「在线设备」卡(同账号其他端:在线 presence + 注册时间 + 移除)→
          顶号契约注记 → 「偏好」行(游戏在线状态开关)→ 底部页签
     交互:本设备行展示推送注册态(已注册/未注册);他端行点按弹出重命名/移除;
          移除=顶掉该端会话(终态,二次确认);开关即时生效,失败提示「设置未保存,请稍后重试」
     状态:在线(绿点)/离线(灰点);推送注册 chip 两态(已注册=indigo/未注册=灰,
          未注册时行内附引导文案);空态文案「当前没有其他在线端。」;
          服务未连接降级文案「设备服务未连接」
     同源:harmony DevicesPage 同文案(顶号契约/游戏在线状态开关/推送注册态);
          桌面 Dialogs 设备对话框 / web DevicesDialog 同数据面;
          离线消息推送到已注册设备(当前为日志传输,真实厂商推送待接入——如实注记) -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp 手机原型 · 设备</title>
<link rel="stylesheet" href="chirp.css">
</head>
<body>

  <!-- 顶栏:副标题挂服务连接态 -->
  <header class="topbar">
    <span class="icon-btn">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </span>
    <div class="grow">
      <div class="title">设备</div>
      <div class="subtitle">设备服务已连接</div>
    </div>
  </header>

  <div class="content" style="gap:12px">

    <!-- 本设备 -->
    <div class="section-label">本设备</div>
    <div class="card">
      <div class="row">
        <span class="icon-btn">
          <svg class="ic" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        </span>
        <div class="grow">
          <div class="name">Pixel 8 <span style="font-size:12px;color:var(--text-3)">· android</span></div>
          <div class="preview">登录于 11-28 20:12</div>
        </div>
        <span class="chip game">推送已注册</span>
      </div>
    </div>

    <!-- 在线设备(同账号其他端) -->
    <div class="section-label">在线设备</div>
    <div class="card">
      <div class="row">
        <span class="icon-btn">
          <svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M9 20.5h6"/></svg>
        </span>
        <div class="grow">
          <div class="name">alice-web <span style="font-size:12px;color:var(--text-3)">· web</span></div>
          <div class="preview">在线 · 登录于 11-27 09:30</div>
        </div>
        <span class="presence on" style="position:static"></span>
      </div>
      <div class="row">
        <span class="icon-btn">
          <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
        </span>
        <div class="grow">
          <div class="name">alice-iphone <span style="font-size:12px;color:var(--text-3)">· ios</span></div>
          <div class="preview">离线 · 上次在线 11-25</div>
        </div>
        <span class="icon-btn" style="width:30px;height:30px" aria-label="移除设备">
          <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </span>
      </div>
    </div>

    <!-- 顶号契约注记(如实) -->
    <div class="system-note">同类型端新登录会顶掉旧会话——踢线是终态,被顶端停止重连并弹回登录页。</div>

    <!-- 偏好 -->
    <div class="section-label">偏好</div>
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="name">游戏在线状态</div>
          <div class="preview">开启后好友可见你正在玩的游戏,私聊消息同步投递进游戏内</div>
        </div>
        <span class="toggle on"></span>
      </div>
    </div>

    <!-- 推送链路注记(如实,与通道无关) -->
    <div class="system-note">离线消息会推送到已注册设备(当前为日志传输,真实厂商推送待接入)。</div>

  </div>

  <nav class="tabbar">
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.6 8.6 0 0 1-3.9-.9L3 20l1-5.5a8.3 8.3 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z"/></svg>
      聊天
    </span>
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 15.5a5 5 0 0 1 5.5 4.5"/></svg>
      好友
    </span>
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><path d="M9 3a2 2 0 1 1 4 0v1h4a1 1 0 0 1 1 1v4h1a2 2 0 1 1 0 4h-1v4a1 1 0 0 1-1 1h-4v-1a2 2 0 1 0-4 0v1H5a1 1 0 0 1-1-1v-4H3a2 2 0 1 1 0-4h1V5a1 1 0 0 1 1-1h4z"/></svg>
      组队
    </span>
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      语音
    </span>
    <span class="tab active">
      <svg class="ic" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
      设备
    </span>
  </nav>

</body>
</html>
