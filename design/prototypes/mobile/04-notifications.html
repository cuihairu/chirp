<!DOCTYPE html>
<!-- chirp 手机端原型 · 04 通知中心
     布局:顶栏(返回 + 标题 + 全部已读)→ 分组「今天/更早」通知流 →
          推送设置卡(系统推送开关 + 免打扰 + 通知类别)
     交互:点通知跳对应会话/请求源;顶栏铃铛进入本页(不占五页签,
          页签保持与桌面 Rail 同源);开关为设置面示意
     状态:未读通知高亮底色;类别 chip(消息/好友/组队/系统);
          推送注册语义同设备页 RegisterDevice(app_gateway WS 5201)
     同源:通知抑制规则同 shouldNotifyFor(隐藏且非当前频道才弹);
          通知类别与 app_notification 服务四类触发对应 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp 手机原型 · 通知</title>
<link rel="stylesheet" href="chirp.css">
<style>
  .notif { display:flex; gap:12px; padding:12px 14px; background:var(--surface); }
  .notif + .notif { border-top:1px solid var(--border-soft); }
  .notif.unread-n { background: var(--accent-dim); }
  .notif .icon-wrap {
    width:38px; height:38px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--accent-soft);
  }
  .notif .icon-wrap svg { width:19px; height:19px; }
  .notif .n-title { font-weight:600; font-size:14px; }
  .notif .n-body { font-size:13px; color:var(--text-2); margin-top:1px; }
  .notif .n-meta { flex:none; text-align:right; }
</style>
</head>
<body>

  <header class="topbar">
    <span class="icon-btn">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </span>
    <div style="flex:1"><div class="title">通知</div></div>
    <button class="btn ghost sm" type="button">全部已读</button>
  </header>

  <div class="content">

    <div class="section-label">今天</div>
    <div class="card">
      <!-- 消息类:未读高亮 -->
      <div class="notif unread-n">
        <span class="icon-wrap">
          <svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.6 8.6 0 0 1-3.9-.9L3 20l1-5.5a8.3 8.3 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z"/></svg>
        </span>
        <div class="grow">
          <div class="n-title">bob · 战队A</div>
          <div class="n-body">集合了,语音房已开</div>
        </div>
        <div class="n-meta"><span class="chip game">消息</span><span class="time" style="font-size:11px;color:var(--text-3)">20:09</span></div>
      </div>
      <!-- 好友请求类 -->
      <div class="notif unread-n">
        <span class="icon-wrap">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M18 8v6M21 11h-6"/></svg>
        </span>
        <div class="grow">
          <div class="n-title">dave 请求加你为好友</div>
          <div class="n-body">附言:昨天车队里见的</div>
        </div>
        <div class="n-meta"><span class="chip">好友</span><span class="time" style="font-size:11px;color:var(--text-3)">19:30</span></div>
      </div>
      <!-- 组队邀请类 -->
      <div class="notif">
        <span class="icon-wrap">
          <svg class="ic" viewBox="0 0 24 24"><path d="M9 3a2 2 0 1 1 4 0v1h4a1 1 0 0 1 1 1v4h1a2 2 0 1 1 0 4h-1v4a1 1 0 0 1-1 1h-4v-1a2 2 0 1 0-4 0v1H5a1 1 0 0 1-1-1v-4H3a2 2 0 1 1 0-4h1V5a1 1 0 0 1 1-1h4z"/></svg>
        </span>
        <div class="grow">
          <div class="n-title">alice 邀请你入队</div>
          <div class="n-body">队伍 1/5 · 等待 8 分钟</div>
        </div>
        <div class="n-meta"><span class="chip">组队</span><span class="time" style="font-size:11px;color:var(--text-3)">19:52</span></div>
      </div>
    </div>

    <div class="section-label">更早</div>
    <div class="card">
      <div class="notif">
        <span class="icon-wrap">
          <svg class="ic" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        </span>
        <div class="grow">
          <div class="n-title">推送已在安卓设备启用</div>
          <div class="n-body">设备注册成功 · alice-手机</div>
        </div>
        <div class="n-meta"><span class="chip">系统</span><span class="time" style="font-size:11px;color:var(--text-3)">昨天</span></div>
      </div>
    </div>

    <!-- 推送设置 -->
    <div class="section-label">推送设置</div>
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="name">系统推送</div>
          <div class="preview">经设备平面注册(RegisterDevice)</div>
        </div>
        <span class="toggle on"></span>
      </div>
      <div class="row">
        <div class="grow">
          <div class="name">免打扰时段</div>
          <div class="preview">23:30 – 08:00 静默</div>
        </div>
        <span class="toggle on"></span>
      </div>
      <div class="row">
        <div class="grow">
          <div class="name">仅好友与群提及时通知</div>
          <div class="preview">@提及与私聊除外</div>
        </div>
        <span class="toggle"></span>
      </div>
    </div>
  </div>

</body>
</html>
