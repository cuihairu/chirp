<!DOCTYPE html>
<!-- chirp 手机端原型 · 01 会话列表(首页)
     布局:顶栏(logo 占位 + Chirp 伴侣 + 当前用户 ID + 通知铃入口)→
          双主操作(新的私聊 / 新建群组)→ 私聊分组 → 群聊分组 → 底部五页签
     交互:行点按进聊天窗;🔔进通知中心;头像进「我的」;双按钮弹全屏 sheet
     状态:未读角标数、最近消息预览、在线 presence 点、置顶分组标题
     同源:桌面 web 会话列表同款数据面,页签=桌面 Rail 五项映射 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp 手机原型 · 会话列表</title>
<link rel="stylesheet" href="chirp.css">
</head>
<body>

  <!-- 顶栏:应用名 + 当前用户 + 通知开关 -->
  <header class="topbar">
    <span class="logo-mark" aria-label="Chirp 占位标识">
      <svg class="ic" viewBox="0 0 24 24" style="stroke:#fff">
        <path d="M4 12h2M9 6v12M14 9v6M19 11v2"/>
      </svg>
    </span>
    <div class="grow" style="flex:1">
      <div class="title">Chirp 伴侣</div>
      <div class="subtitle">alice · 在线</div>
    </div>
    <span class="icon-btn">
      <svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge-dot">3</span>
    </span>
    <span class="avatar-wrap">
      <span class="avatar sm avatar-ring" style="--h:235">a</span>
    </span>
  </header>

  <!-- 主操作 -->
  <div class="content" style="gap:10px">
    <div class="btn-row">
      <button class="btn primary" type="button">
        <svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.6 8.6 0 0 1-3.9-.9L3 20l1-5.5a8.3 8.3 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z"/></svg>
        新的私聊
      </button>
      <button class="btn ghost" type="button">
        <svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 8v6M20 11h-6"/></svg>
        新建群组
      </button>
    </div>

    <!-- 私聊 -->
    <div class="section-label">私聊</div>
    <div class="card">
      <div class="row">
        <span class="avatar-wrap"><span class="avatar" style="--h:150">b</span><span class="presence on"></span></span>
        <div class="grow">
          <div class="name">bob</div>
          <div class="preview">好的,收到</div>
        </div>
        <div class="meta">
          <span class="time">20:12</span>
          <span class="unread">2</span>
        </div>
      </div>
      <div class="row">
        <span class="avatar-wrap"><span class="avatar" style="--h:20">c</span><span class="presence on"></span></span>
        <div class="grow">
          <div class="name">carol</div>
          <div class="preview">在吗?</div>
        </div>
        <div class="meta"><span class="time">19:47</span></div>
      </div>
    </div>

    <!-- 群聊 -->
    <div class="section-label">群聊</div>
    <div class="card">
      <div class="row">
        <span class="avatar-wrap"><span class="avatar" style="--h:265">战</span></span>
        <div class="grow">
          <div class="name">战队A</div>
          <div class="preview">bob: 集合了</div>
        </div>
        <div class="meta">
          <span class="time">20:09</span>
          <span class="unread">5</span>
        </div>
      </div>
      <div class="row">
        <span class="avatar-wrap"><span class="avatar" style="--h:190">水</span></span>
        <div class="grow">
          <div class="name">水友吹水群</div>
          <div class="preview">carol: 今天玩什么</div>
        </div>
        <div class="meta"><span class="time">昨天</span></div>
      </div>
    </div>
  </div>

  <!-- 底部五页签 = 桌面 Rail 同源映射 -->
  <nav class="tabbar">
    <span class="tab active">
      <svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.6 8.6 0 0 1-3.9-.9L3 20l1-5.5a8.3 8.3 0 0 1-1-4A8.4 8.4 0 0 1 11.5 2 8.4 8.4 0 0 1 21 11.5z"/></svg>
      聊天
    </span>
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 15.5a5 5 0 0 1 5.5 4.5"/></svg>
      好友
    </span>
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><path d="M9 3a2 2 0 1 1 4 0v1h4a1 1 0 0 1 1 1v4h1a2 2 0 1 1 0 4h-1v4a1 1 0 0 1-1 1h-4v-1a2 2 0 1 0-4 0v1H5a1 1 0 0 1-1-1v-4H3a2 2 0 1 1 0-4h1V5a1 1 0 0 1 1-1h4z"/></svg>
      组队
    </span>
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      语音
    </span>
    <span class="tab">
      <svg class="ic" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
      设备
    </span>
  </nav>

</body>
</html>
