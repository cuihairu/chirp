# Chirp 分布式集群部署配置
# 用于生产环境的分布式部署

version: '3.8'

services:
  # ============================================
  # 基础设施层
  # ============================================

  # Redis (用于会话管理、Pub/Sub、缓存)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MySQL (用于持久化存储)
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: chirp_root_password_change_me
      MYSQL_DATABASE: chirp
      MYSQL_USER: chirp
      MYSQL_PASSWORD: chirp_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # HAProxy 负载均衡器
  haproxy:
    image: haproxy:2.8-alpine
    ports:
      - "5000:5000"   # Gateway TCP
      - "5001:5001"   # Gateway WebSocket
      - "7000:7000"   # Chat TCP
      - "7001:7001"   # Chat WebSocket
      - "8000:8000"   # Social TCP
      - "8001:8001"   # Social WebSocket
      - "8404:8404"   # HAProxy Stats
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    networks:
      - chirp_net

  # ============================================
  # Gateway 服务层 (无状态，可水平扩展)
  # ============================================

  gateway-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        # Dockerfile.service 的 SERVICE 分支名是全名（无 gateway 别名）。
        SERVICE: game_sdk_gateway
    command:
      - "--port"
      - "5000"
      - "--ws_port"
      - "5001"
      - "--auth_host"
      - "auth-1"
      - "--auth_port"
      - "6000"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
      - "--redis_ttl"
      - "3600"
      - "--instance_id"
      - "gw_1"
      # 平面信任门：chat 的 --gateway_service_secret 与 search 的
      # --gateway_service_secret 同值。
      - "--chat_host"
      - "chat-1"
      - "--chat_port"
      - "7000"
      - "--chat_service_secret"
      - "game-secret"
      - "--search_host"
      - "search-1"
      - "--search_port"
      - "5007"
    depends_on:
      - redis
      - auth-1
      - chat-1
      - search-1
    networks:
      - chirp_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  gateway-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: game_sdk_gateway
    command:
      - "--port"
      - "5000"
      - "--ws_port"
      - "5001"
      - "--auth_host"
      - "auth-2"
      - "--auth_port"
      - "6000"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
      - "--redis_ttl"
      - "3600"
      - "--instance_id"
      - "gw_2"
      - "--chat_host"
      - "chat-1"
      - "--chat_port"
      - "7000"
      - "--chat_service_secret"
      - "game-secret"
      - "--search_host"
      - "search-1"
      - "--search_port"
      - "5007"
    depends_on:
      - redis
      - auth-2
      - chat-1
      - search-1
    networks:
      - chirp_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  gateway-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: game_sdk_gateway
    command:
      - "--port"
      - "5000"
      - "--ws_port"
      - "5001"
      - "--auth_host"
      - "auth-3"
      - "--auth_port"
      - "6000"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
      - "--redis_ttl"
      - "3600"
      - "--instance_id"
      - "gw_3"
      - "--chat_host"
      - "chat-1"
      - "--chat_port"
      - "7000"
      - "--chat_service_secret"
      - "game-secret"
      - "--search_host"
      - "search-1"
      - "--search_port"
      - "5007"
    depends_on:
      - redis
      - auth-3
      - chat-1
      - search-1
    networks:
      - chirp_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # Auth 服务层 (无状态，可水平扩展)
  # ============================================

  auth-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        # 增强版认证（需要 MySQL/libsodium 的目标名）。
        SERVICE: app_auth
    command:
      - "--port"
      - "6000"
      - "--jwt_secret"
      - "production_jwt_secret_change_me"
      # 不带 mysql 参数时进程默认连 127.0.0.1:3306（容器内不存在），必须显式指到 mysql。
      - "--mysql_host"
      - "mysql"
      - "--mysql_port"
      - "3306"
      - "--mysql_user"
      - "chirp"
      - "--mysql_password"
      - "chirp_password_change_me"
      - "--mysql_database"
      - "chirp"
    depends_on:
      - mysql
    networks:
      - chirp_net

  auth-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        # 增强版认证（需要 MySQL/libsodium 的目标名）。
        SERVICE: app_auth
    command:
      - "--port"
      - "6000"
      - "--jwt_secret"
      - "production_jwt_secret_change_me"
      # 不带 mysql 参数时进程默认连 127.0.0.1:3306（容器内不存在），必须显式指到 mysql。
      - "--mysql_host"
      - "mysql"
      - "--mysql_port"
      - "3306"
      - "--mysql_user"
      - "chirp"
      - "--mysql_password"
      - "chirp_password_change_me"
      - "--mysql_database"
      - "chirp"
    depends_on:
      - mysql
    networks:
      - chirp_net

  auth-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        # 增强版认证（需要 MySQL/libsodium 的目标名）。
        SERVICE: app_auth
    command:
      - "--port"
      - "6000"
      - "--jwt_secret"
      - "production_jwt_secret_change_me"
      # 不带 mysql 参数时进程默认连 127.0.0.1:3306（容器内不存在），必须显式指到 mysql。
      - "--mysql_host"
      - "mysql"
      - "--mysql_port"
      - "3306"
      - "--mysql_user"
      - "chirp"
      - "--mysql_password"
      - "chirp_password_change_me"
      - "--mysql_database"
      - "chirp"
    depends_on:
      - mysql
    networks:
      - chirp_net

  # ============================================
  # Chat 服务层 (分布式，使用 MessageRouter)
  # ============================================

  chat-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat_distributed
    command:
      - "--port"
      - "7000"
      - "--ws_port"
      - "7001"
      # Signed-token login: must equal the auth nodes' --jwt_secret
      # (unified login semantics, docs/architecture.md).
      - "--token_secret"
      - "production_jwt_secret_change_me"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
      - "--offline_ttl"
      - "604800"
      - "--instance_id"
      - "chat_1"
      # game 平面信任门：gateway 的 --chat_service_secret 同值。
      - "--gateway_service_secret"
      - "game-secret"
      # server 平面：hub 信任门按 service 名发放 secret（见 server-gateway-1）。
      - "--server_gateway_host"
      - "server-gateway-1"
      - "--server_gateway_port"
      - "8100"
      - "--server_gateway_secret"
      - "chat-secret"
      - "--npc_service_id"
      - "npc_dialog"
    depends_on:
      - redis
      - mysql
      - server-gateway-1
    networks:
      - chirp_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  chat-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat_distributed
    command:
      - "--port"
      - "7000"
      - "--ws_port"
      - "7001"
      # Signed-token login: must equal the auth nodes' --jwt_secret
      # (unified login semantics, docs/architecture.md).
      - "--token_secret"
      - "production_jwt_secret_change_me"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
      - "--offline_ttl"
      - "604800"
      - "--instance_id"
      - "chat_2"
      # game 平面信任门：gateway 的 --chat_service_secret 同值。
      - "--gateway_service_secret"
      - "game-secret"
      # server 平面：hub 信任门按 service 名发放 secret（见 server-gateway-1）。
      - "--server_gateway_host"
      - "server-gateway-1"
      - "--server_gateway_port"
      - "8100"
      - "--server_gateway_secret"
      - "chat-secret"
      - "--npc_service_id"
      - "npc_dialog"
    depends_on:
      - redis
      - mysql
      - server-gateway-1
    networks:
      - chirp_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  chat-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat_distributed
    command:
      - "--port"
      - "7000"
      - "--ws_port"
      - "7001"
      # Signed-token login: must equal the auth nodes' --jwt_secret
      # (unified login semantics, docs/architecture.md).
      - "--token_secret"
      - "production_jwt_secret_change_me"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
      - "--offline_ttl"
      - "604800"
      - "--instance_id"
      - "chat_3"
      # game 平面信任门：gateway 的 --chat_service_secret 同值。
      - "--gateway_service_secret"
      - "game-secret"
      # server 平面：hub 信任门按 service 名发放 secret（见 server-gateway-1）。
      - "--server_gateway_host"
      - "server-gateway-1"
      - "--server_gateway_port"
      - "8100"
      - "--server_gateway_secret"
      - "chat-secret"
      - "--npc_service_id"
      - "npc_dialog"
    depends_on:
      - redis
      - mysql
      - server-gateway-1
    networks:
      - chirp_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # Social 服务层 (可选)
  # ============================================

  social-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: social
    command:
      - "--port"
      - "8000"
      - "--ws_port"
      - "8001"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
    depends_on:
      - redis
    networks:
      - chirp_net

  social-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: social
    command:
      - "--port"
      - "8000"
      - "--ws_port"
      - "8001"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
    depends_on:
      - redis
    networks:
      - chirp_net

  # ============================================
  # Search 服务层（MySQL 回填 + 索引落盘）
  # ============================================

  search-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: search
    command:
      - "--port"
      - "5007"
      # gateway 经 RPC 查询时的信任 secret（game gateway 的
      # --chat_service_secret 同值）。
      - "--gateway_service_secret"
      - "game-secret"
      # --mysql_host 无默认值（空则拒启），必须显式给出。
      - "--mysql_host"
      - "mysql"
      - "--mysql_port"
      - "3306"
      - "--mysql_user"
      - "chirp"
      - "--mysql_password"
      - "chirp_password_change_me"
      - "--mysql_database"
      - "chirp"
      - "--db_path"
      - "/data/search_index.db"
      - "--token_secret"
      - "production_jwt_secret_change_me"
    volumes:
      - search_data:/data
    depends_on:
      - mysql
    networks:
      - chirp_net

  # ============================================
  # Server Gateway（game/server 平面 hub）与 NPC
  # ============================================

  server-gateway-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: game_server_gateway
    command:
      - "--port"
      - "8100"
      # hub 信任门：按接入 service 名逐个发放 secret（chat 与 npc 各一把）。
      - "--service"
      - "chat=chat-secret"
      - "--service"
      - "npc_dialog=npc-secret"
      - "--chat_service_id"
      - "chat"
    networks:
      - chirp_net

  npc-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: npc_dialog
    command:
      # NPC 是 hub 的出站客户端：自身无监听端口。
      - "--server_gateway_host"
      - "server-gateway-1"
      - "--server_gateway_port"
      - "8100"
      - "--server_gateway_secret"
      - "npc-secret"
    depends_on:
      - server-gateway-1
    networks:
      - chirp_net

  # ============================================
  # Voice / Party（房间态在内存 + Redis 快照）
  # ============================================

  voice-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: voice
    command:
      - "--port"
      - "9000"
      - "--ws_port"
      - "9001"
      - "--token_secret"
      - "production_jwt_secret_change_me"
    networks:
      - chirp_net

  party-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: party
    command:
      - "--port"
      - "7500"
      - "--ws_port"
      - "7501"
      - "--token_secret"
      - "production_jwt_secret_change_me"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
    depends_on:
      - redis
    networks:
      - chirp_net

  # ============================================
  # App 平面（companion 边 + 推送）
  # ============================================

  notification-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app_notification
    command:
      - "--port"
      - "5006"
      - "--ws_port"
      - "5016"
      # caller 信任门：app-gateway 的 --notification_secret 同值。
      - "--service_secret"
      - "notification-caller-secret"
      - "--device_store_file"
      - "/data/device_store.json"
    volumes:
      - notification_data:/data
    networks:
      - chirp_net

  app-gateway-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app_sdk_gateway
    command:
      - "--port"
      - "5200"
      - "--ws_port"
      - "5201"
      - "--instance_id"
      - "appgw_1"
      - "--auth_host"
      - "auth-1"
      - "--auth_port"
      - "6000"
      - "--redis_host"
      - "redis"
      - "--redis_port"
      - "6379"
      - "--redis_ttl"
      - "3600"
      - "--chat_host"
      - "chat-1"
      - "--chat_port"
      - "7000"
      - "--chat_service_secret"
      - "game-secret"
      - "--sg_host"
      - "chat-1"
      - "--sg_port"
      - "7000"
      - "--sg_secret"
      - "game-secret"
      - "--search_host"
      - "search-1"
      - "--search_port"
      - "5007"
      - "--notification_host"
      - "notification-1"
      - "--notification_port"
      - "5006"
      - "--notification_secret"
      - "notification-caller-secret"
    depends_on:
      - redis
      - auth-1
      - chat-1
      - search-1
      - notification-1
    ports:
      - "5200:5200"   # App Gateway TCP（companion 边）
      - "5201:5201"   # App Gateway WebSocket
    networks:
      - chirp_net

  # ============================================
  # 监控和管理工具 (可选)
  # ============================================

  # Redis Commander - Redis Web 管理界面
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - chirp_net
    profiles:
      - tools

  # Adminer - 数据库管理界面
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - chirp_net
    profiles:
      - tools

networks:
  chirp_net:
    driver: bridge

volumes:
  redis_data:
  mysql_data:
  search_data:
  notification_data:
