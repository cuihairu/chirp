# apps/desktop 是独立项目(不在根 pnpm-workspace.yaml 的 packages 里),
# 自带一把锁文件。packages: ['.'] 把 workspace 根钉在本目录,pnpm 向上找
# workspace 根时在这里停下,不会并进仓库根那把锁。
packages:
  - '.'

# pnpm 12 默认不跑依赖的生命周期脚本,未显式决定时直接报错退出
# (ERR_PNPM_IGNORED_BUILDS)。protobufjs 的 postinstall 放行条目随 ts-proto
# 2.x 换 @bufbuild/protobuf 运行时一并移除——依赖树里已无该包。
