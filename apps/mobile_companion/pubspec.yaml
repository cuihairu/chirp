name: chirp_mobile
description: Chirp real-time communication mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # FFI for native SDK integration
  ffi: ^2.1.0

  # WebRTC for voice calls
  flutter_webrtc: ^0.9.47+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
