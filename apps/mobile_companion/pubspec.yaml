name: chirp_mobile
description: Chirp real-time communication mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Committed generated wire protocol (proto/dart, same bytes as the web
  # companion's @chirp/proto); fixnum comes with the protobuf runtime's
  # Int64 fields (Packet.sequence, timestamps).
  chirp_proto:
    path: ../../proto/dart
  protobuf: ^3.1.0
  fixnum: ^1.1.0

  # Per-install device_id persistence (web-parity with localStorage).
  shared_preferences: ^2.2.3

  # Foreground local notifications (web-parity with the Notification API
  # surface; real push transport is a backend item).
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
