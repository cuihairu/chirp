org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# Flutter V2 Embedding
android.defaults.buildfeatures.buildconfig=true
flutter.versionName=1.0.0
flutter.versionCode=1
kotlin_version=1.9.0
# The Flutter 3.24 gradle plugin enables minify+shrinkResources on
# release builds by default (shouldShrinkResources defaults to true);
# applied after evaluation it trips AGP 8's validation ("Removing
# unused resources requires unused code shrinking to be turned on").
# Keep the app's own release config until R8 keep rules exist.
shrink=false
